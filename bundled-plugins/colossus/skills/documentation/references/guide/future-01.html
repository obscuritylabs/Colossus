<h1>Future features</h1>


  
    
    








<p>Avoid documenting future features or products, even in innocuous
  ways. Don't pre-announce anything in documentation unless it has been approved by your legal counsel.</p>



<p>See also <a href="/style/tense">Present tense</a> and
<a href="/style/timeless-documentation">Timeless documentation</a>.</p>
