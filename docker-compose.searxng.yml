services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: colossus-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://localhost:8888/}"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-colossus-local-dev-change-me}"
      SEARXNG_LIMITER: "false"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng

volumes:
  searxng-cache:
