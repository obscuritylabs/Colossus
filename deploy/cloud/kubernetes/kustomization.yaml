apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: colossus
resources:
  - namespace.yaml
  - control-plane.yaml
  - ingress.yaml
configMapGenerator:
  - name: colossus-cloud-config
    files:
      - cloud.json
# Pin this image tag to a tested immutable release or replace it with a digest.
images:
  - name: colossus-cloud
    newName: registry.example.com/colossus/cloud
    newTag: replace-with-your-built-image
