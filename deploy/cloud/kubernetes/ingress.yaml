# Example for ingress-nginx. Its controller must enable --enable-ssl-passthrough.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: colossus-browser
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [colossus.example.com]
      secretName: colossus-browser-tls
  rules:
    - host: colossus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: colossus-cloud, port: {name: http}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: colossus-runtime
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
spec:
  ingressClassName: nginx
  rules:
    - host: runtimes.colossus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: colossus-cloud, port: {name: connector}}
