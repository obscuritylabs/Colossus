services:
  oidc:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: [start-dev, --import-realm]
    ports: ["127.0.0.1:8180:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only-admin
      KC_HOSTNAME: http://127.0.0.1:8180
    volumes: ["./realm.json:/opt/keycloak/data/import/colossus.json:ro"]
    mem_limit: 1g
  postgres:
    image: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_USER: colossus
      POSTGRES_PASSWORD: local-only-database
      POSTGRES_DB: colossus_cloud
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U colossus -d colossus_cloud"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 512m
