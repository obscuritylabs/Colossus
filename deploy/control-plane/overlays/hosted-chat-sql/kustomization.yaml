apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: colossus
resources:
  - ../../kubernetes
patches:
  - path: deployment.yaml
configMapGenerator:
  - name: colossus-control-plane-config
    behavior: replace
    files:
      - control-plane.json
replacements:
  - source:
      kind: Deployment
      name: colossus-control-plane
      fieldPath: spec.template.spec.containers.[name=control-plane].image
    targets:
      - select:
          kind: Deployment
          name: colossus-control-plane
        fieldPaths:
          - spec.template.spec.initContainers.[name=prepare-chat-cache].image
