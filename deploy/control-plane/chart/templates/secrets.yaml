{{- if not .Values.auth.state.existingSecret }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace (include "cp.stateSecret" .)) | default dict }}
{{- $data := $old.data | default dict }}
{{- if and $old (not (index $data .Values.auth.state.authKeyKey)) (not .Values.auth.state.authKey) }}
  {{- fail "retained auth Secret has no auth key; restore it or explicitly supply auth.state.authKey" }}
{{- end }}
{{- if and $old .Values.auth.bootstrap.enabled .Values.auth.local.enabled (not (index $data .Values.auth.state.bootstrapPasswordKey)) (not .Values.auth.bootstrap.password) }}
  {{- fail "retained auth Secret has no bootstrap password; restore it or disable bootstrap after provisioning" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.stateSecret" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "cp.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.state.authKeyKey }}: {{ default (default (randBytes 32 | b64dec | sha256sum | b64enc) (index $data .Values.auth.state.authKeyKey)) (.Values.auth.state.authKey | b64enc) | quote }}
  {{- if and .Values.auth.bootstrap.enabled .Values.auth.local.enabled }}
  {{ .Values.auth.state.bootstrapPasswordKey }}: {{ default (default (randAlphaNum 32 | b64enc) (index $data .Values.auth.state.bootstrapPasswordKey)) (.Values.auth.bootstrap.password | b64enc) | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.postgres.enabled (not .Values.global.databaseSecretName) }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace (include "cp.databaseSecret" .)) | default dict }}
{{- $data := $old.data | default dict }}
{{- if and $old (not (index $data "CUSTOM_PASSWORD")) }}
  {{- fail "retained database Secret has no application password; restore it before upgrading" }}
{{- end }}
{{- $password := default (randAlphaNum 32 | b64enc) (index $data "CUSTOM_PASSWORD") | b64dec }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.databaseSecret" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "cp.labels" . | nindent 4 }}
type: Opaque
data:
  CUSTOM_USER: {{ "colossus" | b64enc | quote }}
  CUSTOM_DB: {{ "colossus" | b64enc | quote }}
  CUSTOM_PASSWORD: {{ $password | b64enc | quote }}
  uri: {{ printf "postgresql://colossus:%s@%s.%s.svc:%v/colossus" ($password | urlquery) (include "cp.postgresName" .) .Release.Namespace .Values.postgres.service.port | b64enc | quote }}
{{- end }}
{{- if and (not .Values.postgres.enabled) (not .Values.database.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.externalDatabaseSecret" . }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.external.secretKey }}: {{ required "database.external.url or existingSecret is required" .Values.database.external.url | quote }}
{{- end }}
{{- if and (not .Values.postgres.enabled) (eq .Values.database.external.tls.mode "custom_ca") (not .Values.database.external.tls.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.databaseCaSecret" . }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.external.tls.caKey }}: {{ required "external database custom_ca requires caCertificate or existingSecret" .Values.database.external.tls.caCertificate | quote }}
{{- end }}
{{- if and .Values.auth.oidc.enabled .Values.auth.oidc.clientSecret (not .Values.auth.oidc.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.oidcSecret" . }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.oidc.secretKey }}: {{ .Values.auth.oidc.clientSecret | quote }}
{{- end }}

{{- if and .Values.postgres.enabled (not .Values.global.postgresAdminSecretName) }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace (include "cp.postgresAdminSecret" .)) | default dict }}
{{- $data := $old.data | default dict }}
{{- if and $old (not (index $data "postgres-password")) }}
  {{- fail "retained database administrator Secret has no password; restore it before upgrading" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.postgresAdminSecret" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "cp.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ default (randAlphaNum 32 | b64enc) (index $data "postgres-password") | quote }}
{{- end }}
