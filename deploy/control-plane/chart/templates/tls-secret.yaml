{{- if not .Values.tls.existingSecret -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace (include "cp.tlsSecret" .)) | default dict -}}
{{- $data := $old.data | default dict -}}
{{- if and $old (not .Values.tls.caCertificate) (or (not (index $data .Values.tls.caCertificateKey)) (not (index $data .Values.tls.caPrivateKeyKey))) -}}
  {{- fail "retained connector CA Secret is incomplete; restore it instead of implicitly replacing its authority" -}}
{{- end -}}
{{- $annotations := ($old.metadata | default dict).annotations | default dict -}}
{{- $ca := dict -}}
{{- $leaf := dict -}}
{{- if .Values.tls.caCertificate -}}
  {{- $ca = dict "Cert" .Values.tls.caCertificate "Key" (required "tls.caPrivateKey is required with caCertificate" .Values.tls.caPrivateKey) -}}
  {{- $leaf = dict "Cert" (required "tls.serverCertificate is required with supplied CA" .Values.tls.serverCertificate) "Key" (required "tls.serverPrivateKey is required with supplied CA" .Values.tls.serverPrivateKey) -}}
{{- else -}}
  {{- if and (index $data .Values.tls.caCertificateKey) (index $data .Values.tls.caPrivateKeyKey) -}}
    {{- $ca = buildCustomCert (index $data .Values.tls.caCertificateKey) (index $data .Values.tls.caPrivateKeyKey) -}}
  {{- else -}}
    {{- $ca = genCAWithKey (printf "%s connector CA" .Release.Name) 3650 (genPrivateKey "ed25519") -}}
  {{- end -}}
  {{- if and (index $data .Values.tls.serverCertificateKey) (index $data .Values.tls.serverPrivateKeyKey) (eq (index $annotations "colossus.ai/connector-host") .Values.connectorHost) (eq (default "" (index $annotations "colossus.ai/renewal-revision")) .Values.tls.renewalRevision) -}}
    {{- $leaf = dict "Cert" (index $data .Values.tls.serverCertificateKey | b64dec) "Key" (index $data .Values.tls.serverPrivateKeyKey | b64dec) -}}
  {{- else -}}
    {{- $leaf = genSignedCertWithKey .Values.connectorHost nil (list .Values.connectorHost) (int .Values.tls.validityDays) $ca (genPrivateKey "ed25519") -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.tlsSecret" . }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    colossus.ai/connector-host: {{ .Values.connectorHost | quote }}
    colossus.ai/renewal-revision: {{ .Values.tls.renewalRevision | quote }}
type: Opaque
data:
  {{ .Values.tls.caCertificateKey }}: {{ $ca.Cert | b64enc | quote }}
  {{ .Values.tls.caPrivateKeyKey }}: {{ $ca.Key | b64enc | quote }}
  {{ .Values.tls.serverCertificateKey }}: {{ $leaf.Cert | b64enc | quote }}
  {{ .Values.tls.serverPrivateKeyKey }}: {{ $leaf.Key | b64enc | quote }}
{{- end }}
