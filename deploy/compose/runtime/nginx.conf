pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Internal readiness only. Browser traffic is exclusively HTTPS.
    server {
        listen 127.0.0.1:8080;
        location = /health/ready { proxy_pass http://control-plane:8080/health/ready; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/colossus/server.pem;
        ssl_certificate_key /run/colossus/server-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16m;
        location /docs/ { proxy_pass http://documentation:8080; }
        location = /docs { return 308 /docs/; }
        location / {
            proxy_pass http://control-plane:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
