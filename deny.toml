[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
ignore = [
    # OIDC verifies signatures with public keys only; certificate issuance is
    # Ed25519. No application path performs RSA private-key operations.
    # See ADR 0006. Remove when OpenID Connect drops the affected dependency.
    { id = "RUSTSEC-2023-0071", reason = "OIDC public-key verification is outside the private-key timing attack; no application RSA private-key operations" },
    # Only OpenID Connect retains crypto-bigint 0.5.5, for public P-256/P-384
    # signature verification. Secret signing uses p256 0.14 / crypto-bigint 0.7.6.
    # The wrapper bans below reject direct imports of the legacy arithmetic.
    # See ADR 0006; remove when OpenID Connect adopts patched arithmetic.
    { id = "RUSTSEC-2026-0387", reason = "Legacy EC arithmetic is confined to OIDC public-key verification; application secret signing uses patched crypto-bigint" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
deny = [
    { crate = "crypto-bigint:<0.7.6", wrappers = ["elliptic-curve"], reason = "Legacy arithmetic is reserved for OIDC public-key verification; see ADR 0006" },
    { crate = "elliptic-curve:<0.14", wrappers = ["ecdsa", "primeorder", "p256", "p384"], reason = "Legacy EC APIs must remain inside the reviewed OIDC verification chain" },
    { crate = "ecdsa:<0.17", wrappers = ["p256", "p384"], reason = "Legacy EC APIs must remain inside the reviewed OIDC verification chain" },
    { crate = "primeorder:<0.14", wrappers = ["p256", "p384"], reason = "Legacy EC APIs must remain inside the reviewed OIDC verification chain" },
    { crate = "p256:<0.14", wrappers = ["openidconnect"], reason = "Application secret signing must use patched arithmetic; legacy P-256 is only for OIDC verification" },
    { crate = "p384:<0.14", wrappers = ["openidconnect"], reason = "Legacy P-384 is only for OIDC public-key verification" },
    { crate = "birdcage", reason = "GPL-3.0-only is incompatible with Apache-2.0 distribution" },
    { crate = "native-tls", reason = "network adapters must use pinned rustls trust instead of platform TLS defaults" },
    { crate = "openssl", reason = "network adapters use rustls and must not introduce an OpenSSL runtime dependency" },
    { crate = "openssl-sys", reason = "network adapters use rustls and must not introduce an OpenSSL runtime dependency" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
