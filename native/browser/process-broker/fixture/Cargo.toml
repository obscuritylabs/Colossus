[package]
name = "colossus-mac-supervisor-sentinel-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0"

[features]
default = []
native-acceptance = ["colossus-mac-browser-process-broker/macos-process-observation-fixture", "dep:ed25519-dalek", "dep:sha2", "dep:libc", "dep:rustix"]
core-entry = ["native-acceptance"]

[[bin]]
name = "controller"
path = "src/bin/controller.rs"
required-features = ["native-acceptance"]

[[bin]]
name = "core"
path = "src/bin/core.rs"
required-features = ["core-entry"]

[dependencies]
colossus-mac-browser-process-broker = { version = "=0.1.0", path = ".." }
ed25519-dalek = { version = "2.2.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = { version = "0.10.9", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
colossus-darwin-process = { version = "=0.11.11-preview.4", path = "../../../../crates/colossus-darwin-process" }
libc = { version = "0.2.186", optional = true }
rustix = { version = "1.1.4", features = ["event", "fs"], optional = true }

[workspace]
resolver = "3"

[lints.clippy]
all = { level = "deny", priority = -1 }
