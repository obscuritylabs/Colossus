colossus-domain = { version = "=0.10.5", path = "crates/colossus-domain" }
colossus-journal-redb = { version = "=0.10.5", path = "crates/colossus-journal-redb" }
colossus-journal-postgres = { version = "=0.10.5", path = "crates/colossus-journal-postgres" }
colossus-memory = { version = "=0.10.5", path = "crates/colossus-memory" }
