[workspace]
resolver = "3"
members = [
    "xtask",
    "crates/colossus-domain",
    "crates/colossus-contracts",
    "crates/colossus-api-proto",
    "crates/colossus-api",
    "crates/colossus-api-runtime",
    "crates/colossus-grpc",
    "crates/colossus-sdk",
    "crates/colossus-darwin-process",
    "crates/colossus-sidecar-protocol",
    "crates/colossus-sidecar",
    "crates/colossus-ports",
    "crates/colossus-journal-redb",
    "crates/colossus-journal-postgres",
    "crates/colossus-projection",
    "crates/colossus-audit",
    "crates/colossus-sandbox",
    "crates/colossus-windows-process",
    "crates/colossus-windows-native",
    "crates/colossus-access",
    "crates/colossus-network",
    "crates/colossus-policy",
    "crates/colossus-codex-auth",
    "crates/colossus-provider",
    "crates/colossus-search",
    "crates/colossus-update",
    "crates/colossus-tools",
    "crates/colossus-agent",
    "crates/colossus-session",
    "crates/colossus-context",
    "crates/colossus-work",
    "crates/colossus-memory",
    "crates/colossus-memory-chroma",
    "crates/colossus-research",
    "crates/colossus-telemetry",
    "crates/colossus-skills",
    "crates/colossus-integrations",
    "crates/colossus-mcp",
    "crates/colossus-packs",
    "crates/colossus-workflow",
    "crates/colossus-presentation",
    "crates/colossus-tui",
    "crates/colossus-runtime",
    "crates/colossus-worker",
    "crates/colossus-cli",
    "crates/colossus-testkit",
    "crates/colossus-fuzzing",
]

[workspace.package]
version = "0.10.5"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/obscuritylabs/Colossus"

[workspace.dependencies]
async-trait = "0.1.89"
async-recursion = "1.1.1"
base64 = "0.22.1"
capctl = "0.2.4"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
command-group = "=5.0.1"
crossterm = "0.29.0"
directories = "6.0.0"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "rand_core"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.4.2"
futures = "0.3.31"
flate2 = "1.1.9"
fs4 = "0.13.1"
globset = "0.4.18"
ignore = "0.4.28"
jsonschema = "0.33.0"
keyring = "4.1.4"
nono = { version = "=0.67.1", default-features = false }
nix = { version = "0.31.3", features = ["sched"] }
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
p256 = { version = "0.13.2", features = ["pkcs8"] }
prost = "0.14.4"
prost-types = "0.14.4"
protoc-bin-vendored = "=3.2.0"
rappct = "=0.13.3"
redb = "4.1.0"
regex = "1.13.0"
rmcp = { version = "=2.2.0", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "macros"] }
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1.1.4", features = ["mount", "process"] }
security-framework = "3.7.0"
sysinfo = { version = "=0.39.5", default-features = false, features = ["system"] }
subtle = "2.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde-saphyr = "0.0.29"
sha2 = "0.10.9"
sse-stream = "0.2.1"
tempfile = "3.25.0"
tar = "0.4.46"
tantivy = "0.26.1"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.49.0", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["io"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
toml = "1.1.2"
tower = { version = "0.5.3", features = ["limit"] }
uuid = { version = "1.23.4", features = ["serde", "v7"] }
url = "2.5.8"
unicode-width = "0.2.2"
portable-pty = "0.9.0"
pulldown-cmark = "0.13.4"
inkjet = { version = "0.11.1", default-features = false, features = [
    "language-bash",
    "language-c",
    "language-cpp",
    "language-css",
    "language-diff",
    "language-dockerfile",
    "language-go",
    "language-html",
    "language-java",
    "language-javascript",
    "language-json",
    "language-jsx",
    "language-plaintext",
    "language-proto",
    "language-python",
    "language-ruby",
    "language-rust",
    "language-sql",
    "language-swift",
    "language-toml",
    "language-tsx",
    "language-typescript",
] }
vt100 = "0.16.2"
windows-sys = "=0.61.2"
webpki-roots = "1.0.8"
x509-parser = "0.18.1"
zeroize = "1.8.2"

