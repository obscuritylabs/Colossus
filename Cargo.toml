[workspace]
resolver = "3"
members = [
    "crates/colossus-domain",
    "crates/colossus-contracts",
    "crates/colossus-ports",
    "crates/colossus-journal-redb",
    "crates/colossus-journal-postgres",
    "crates/colossus-projection",
    "crates/colossus-audit",
    "crates/colossus-sandbox",
    "crates/colossus-windows-process",
    "crates/colossus-access",
    "crates/colossus-policy",
    "crates/colossus-provider",
    "crates/colossus-search",
    "crates/colossus-tools",
    "crates/colossus-agent",
    "crates/colossus-session",
    "crates/colossus-context",
    "crates/colossus-work",
    "crates/colossus-memory",
    "crates/colossus-memory-chroma",
    "crates/colossus-research",
    "crates/colossus-telemetry",
    "crates/colossus-skills",
    "crates/colossus-integrations",
    "crates/colossus-mcp",
    "crates/colossus-packs",
    "crates/colossus-workflow",
    "crates/colossus-presentation",
    "crates/colossus-tui",
    "crates/colossus-runtime",
    "crates/colossus-worker",
    "crates/colossus-cli",
    "crates/colossus-testkit",
    "crates/colossus-fuzzing",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/obscuritylabs/Colossus"

[workspace.dependencies]
async-trait = "0.1.89"
async-recursion = "1.1.1"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
command-group = "=5.0.1"
crossterm = "0.29.0"
directories = "6.0.0"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "rand_core"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
futures = "0.3.31"
flate2 = "1.1.9"
fs4 = "0.13.1"
globset = "0.4.18"
ignore = "0.4.28"
jsonschema = "0.33.0"
keyring = "4.1.4"
nono = { version = "=0.67.1", default-features = false }
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
rappct = "=0.13.3"
redb = "4.1.0"
regex = "1.13.0"
rmcp = { version = "=2.2.0", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "macros"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
sysinfo = { version = "=0.39.5", default-features = false, features = ["system"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde-saphyr = "0.0.29"
sha2 = "0.10.9"
tempfile = "3.25.0"
tar = "0.4.46"
tantivy = "0.26.1"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
toml = "1.1.2"
uuid = { version = "1.23.4", features = ["serde", "v7"] }
url = "2.5.8"
unicode-width = "0.2.2"
portable-pty = "0.9.0"
vt100 = "0.16.2"
windows-sys = "=0.61.2"
webpki-roots = "1.0.8"

colossus-contracts = { version = "=0.9.0", path = "crates/colossus-contracts" }
colossus-access = { version = "=0.9.0", path = "crates/colossus-access" }
colossus-audit = { version = "=0.9.0", path = "crates/colossus-audit" }
colossus-context = { version = "=0.9.0", path = "crates/colossus-context" }
colossus-work = { version = "=0.9.0", path = "crates/colossus-work" }
colossus-domain = { version = "=0.9.0", path = "crates/colossus-domain" }
colossus-journal-redb = { version = "=0.9.0", path = "crates/colossus-journal-redb" }
colossus-journal-postgres = { version = "=0.9.0", path = "crates/colossus-journal-postgres" }
colossus-memory = { version = "=0.9.0", path = "crates/colossus-memory" }
colossus-memory-chroma = { version = "=0.9.0", path = "crates/colossus-memory-chroma" }
colossus-research = { version = "=0.9.0", path = "crates/colossus-research" }
colossus-telemetry = { version = "=0.9.0", path = "crates/colossus-telemetry" }
colossus-testkit = { version = "=0.9.0", path = "crates/colossus-testkit" }
colossus-fuzzing = { version = "=0.9.0", path = "crates/colossus-fuzzing" }
colossus-skills = { version = "=0.9.0", path = "crates/colossus-skills" }
colossus-integrations = { version = "=0.9.0", path = "crates/colossus-integrations" }
colossus-mcp = { version = "=0.9.0", path = "crates/colossus-mcp" }
colossus-packs = { version = "=0.9.0", path = "crates/colossus-packs" }
colossus-policy = { version = "=0.9.0", path = "crates/colossus-policy" }
colossus-provider = { version = "=0.9.0", path = "crates/colossus-provider" }
colossus-search = { version = "=0.9.0", path = "crates/colossus-search" }
colossus-tools = { version = "=0.9.0", path = "crates/colossus-tools" }
colossus-agent = { version = "=0.9.0", path = "crates/colossus-agent" }
colossus-session = { version = "=0.9.0", path = "crates/colossus-session" }
colossus-ports = { version = "=0.9.0", path = "crates/colossus-ports" }
colossus-projection = { version = "=0.9.0", path = "crates/colossus-projection" }
colossus-sandbox = { version = "=0.9.0", path = "crates/colossus-sandbox" }
colossus-windows-process = { version = "=0.9.0", path = "crates/colossus-windows-process" }
colossus-runtime = { version = "=0.9.0", path = "crates/colossus-runtime" }
colossus-worker = { version = "=0.9.0", path = "crates/colossus-worker" }
colossus-workflow = { version = "=0.9.0", path = "crates/colossus-workflow" }
colossus-presentation = { version = "=0.9.0", path = "crates/colossus-presentation" }
colossus-tui = { version = "=0.9.0", path = "crates/colossus-tui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Integration acceptance stages the real test-built executable inside a bounded signed
# bundle. Keep code and panic metadata, but do not make distribution behavior depend on
# platform-specific linker debug-section size.
[profile.test]
strip = "debuginfo"
