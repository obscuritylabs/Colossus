[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Integration acceptance stages the real test-built executable inside a bounded signed
# bundle. Keep code and panic metadata, but do not make distribution behavior depend on
# platform-specific linker debug-section size.
[profile.test]
strip = "debuginfo"
