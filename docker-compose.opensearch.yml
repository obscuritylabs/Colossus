name: colossus-opensearch

services:
  opensearch:
    image: docker.io/opensearchproject/opensearch:${OPENSEARCH_VERSION:-latest}
    container_name: colossus-opensearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
      - "127.0.0.1:${OPENSEARCH_PERF_PORT:-9600}:9600"
    environment:
      - cluster.name=colossus-opensearch
      - node.name=colossus-opensearch-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  opensearch-data:
