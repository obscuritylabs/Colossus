[book]
title = "Colossus Documentation"
authors = ["Obscurity Labs"]
description = "User, operator, security, and developer documentation for the Colossus Rust runtime."
language = "en"
src = "docs"

[rust]
edition = "2024"

[build]
build-dir = "site"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
no-section-label = true
git-repository-url = "https://github.com/obscuritylabs/Colossus"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/obscuritylabs/Colossus/edit/main/{path}"
site-url = "/Colossus/"
sidebar-header-nav = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
use-boolean-and = true
boost-title = 3
boost-hierarchy = 2
heading-split-level = 3
