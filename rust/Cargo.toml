[workspace]
resolver = "3"
members = [
    "crates/colossus-domain",
    "crates/colossus-contracts",
    "crates/colossus-ports",
    "crates/colossus-journal-redb",
    "crates/colossus-policy",
    "crates/colossus-memory",
    "crates/colossus-workflow",
    "crates/colossus-runtime",
    "crates/colossus-cli",
    "crates/colossus-testkit",
]

[workspace.package]
version = "0.6.0-alpha.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/killswitch-GUI/Colossus"

[workspace.dependencies]
async-trait = "0.1.89"
async-recursion = "1.1.1"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "rand_core"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
futures = "0.3.31"
jsonschema = "0.33.0"
keyring = "4.1.4"
redb = "4.1.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
reedline = "0.49.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.29"
sha2 = "0.10.9"
tempfile = "3.25.0"
tantivy = "0.26.1"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.23.4", features = ["serde", "v7"] }

colossus-contracts = { path = "crates/colossus-contracts" }
colossus-domain = { path = "crates/colossus-domain" }
colossus-journal-redb = { path = "crates/colossus-journal-redb" }
colossus-memory = { path = "crates/colossus-memory" }
colossus-policy = { path = "crates/colossus-policy" }
colossus-ports = { path = "crates/colossus-ports" }
colossus-runtime = { path = "crates/colossus-runtime" }
colossus-workflow = { path = "crates/colossus-workflow" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
