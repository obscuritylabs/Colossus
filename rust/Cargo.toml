[workspace]
resolver = "3"
members = [
    "crates/colossus-domain",
    "crates/colossus-contracts",
    "crates/colossus-ports",
    "crates/colossus-journal-redb",
    "crates/colossus-projection",
    "crates/colossus-sandbox",
    "crates/colossus-policy",
    "crates/colossus-provider",
    "crates/colossus-tools",
    "crates/colossus-agent",
    "crates/colossus-session",
    "crates/colossus-context",
    "crates/colossus-work",
    "crates/colossus-memory",
    "crates/colossus-research",
    "crates/colossus-telemetry",
    "crates/colossus-skills",
    "crates/colossus-integrations",
    "crates/colossus-mcp",
    "crates/colossus-packs",
    "crates/colossus-workflow",
    "crates/colossus-runtime",
    "crates/colossus-cli",
    "crates/colossus-testkit",
]

[workspace.package]
version = "0.6.0-alpha.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/killswitch-GUI/Colossus"

[workspace.dependencies]
async-trait = "0.1.89"
async-recursion = "1.1.1"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
command-group = "=5.0.1"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "rand_core"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
futures = "0.3.31"
flate2 = "1.1.9"
fs4 = "0.13.1"
globset = "0.4.18"
ignore = "0.4.28"
jsonschema = "0.33.0"
keyring = "4.1.4"
nono = { version = "=0.67.1", default-features = false }
redb = "4.1.0"
regex = "1.13.0"
rmcp = { version = "=2.2.0", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
reedline = "0.49.0"
sysinfo = { version = "=0.39.5", default-features = false, features = ["system"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.29"
sha2 = "0.10.9"
tempfile = "3.25.0"
tar = "0.4.46"
tantivy = "0.26.1"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.23.4", features = ["serde", "v7"] }
url = "2.5.8"

colossus-contracts = { path = "crates/colossus-contracts" }
colossus-context = { path = "crates/colossus-context" }
colossus-work = { path = "crates/colossus-work" }
colossus-domain = { path = "crates/colossus-domain" }
colossus-journal-redb = { path = "crates/colossus-journal-redb" }
colossus-memory = { path = "crates/colossus-memory" }
colossus-research = { path = "crates/colossus-research" }
colossus-telemetry = { path = "crates/colossus-telemetry" }
colossus-testkit = { path = "crates/colossus-testkit" }
colossus-skills = { path = "crates/colossus-skills" }
colossus-integrations = { path = "crates/colossus-integrations" }
colossus-mcp = { path = "crates/colossus-mcp" }
colossus-packs = { path = "crates/colossus-packs" }
colossus-policy = { path = "crates/colossus-policy" }
colossus-provider = { path = "crates/colossus-provider" }
colossus-tools = { path = "crates/colossus-tools" }
colossus-agent = { path = "crates/colossus-agent" }
colossus-session = { path = "crates/colossus-session" }
colossus-ports = { path = "crates/colossus-ports" }
colossus-projection = { path = "crates/colossus-projection" }
colossus-sandbox = { path = "crates/colossus-sandbox" }
colossus-runtime = { path = "crates/colossus-runtime" }
colossus-workflow = { path = "crates/colossus-workflow" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
