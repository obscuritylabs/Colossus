[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "obscuritylabs-colossus-sdk"
version = "0.10.5"
description = "Security-focused Python SDK for the Colossus public gRPC API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Obscurity Labs" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=46,<50",
  "googleapis-common-protos>=1.75,<2",
  "grpcio>=1.82.1,<2",
  "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.1,<3",
  "ruff>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/obscuritylabs/Colossus"
Repository = "https://github.com/obscuritylabs/Colossus"

[tool.setuptools.packages.find]
where = ["src", "generated"]
namespaces = true

[tool.setuptools.package-data]
colossus_sdk = ["py.typed"]
"colossus.api.v1alpha1" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Protobuf and gRPC modules are canonical compiler output covered by the
# generation digest. Formatting them here would make Ruff an implicit codegen
# input and break byte-for-byte reproducibility.
extend-exclude = ["generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["colossus_sdk"]
mypy_path = ["src", "generated"]
