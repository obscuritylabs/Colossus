version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/obscuritylabs/colossus/sdk/go/gen
plugins:
  - local: typescript/node_modules/.bin/protoc-gen-ts_proto
    out: typescript/src/gen
    strategy: all
    opt:
      - env=node
      - enumsAsLiterals=true
      - esModuleInterop=true
      - forceLong=bigint
      - importSuffix=.js
      - oneof=unions-value
      - outputIndex=true
      - outputServices=grpc-js
      - useAbortSignal=true
      - useAsyncIterable=true
      - useExactTypes=false
  - local: .tools/bin/protoc-gen-go
    out: go/gen
    opt:
      - paths=source_relative
  - local: .tools/bin/protoc-gen-go-grpc
    out: go/gen
    opt:
      - paths=source_relative
inputs:
  - directory: ../api
