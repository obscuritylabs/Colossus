[package]
name = "colossus-native-browser"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
workspace = "../src-tauri"

[features]
cef-preview = ["dep:serde_json", "dep:sha2", "dep:rustls-pki-types", "dep:x509-parser", "dep:zeroize", "dep:colossus-native-browser-pki", "dep:colossus-browser-presentation", "dep:async-trait"]
native-test-driver = ["objc2-foundation/NSData", "objc2-foundation/NSJSONSerialization"]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
colossus-native-browser-pki = { version = "=0.1.0", path = "../../../native/browser/pki", optional = true }
colossus-browser-presentation = { version = "=0.11.8", path = "../../../crates/colossus-browser-presentation", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", optional = true }
sha2 = { version = "0.10.9", optional = true }
rustls-pki-types = { version = "1.14.0", optional = true }
x509-parser = { version = "0.18.1", optional = true }
zeroize = { version = "1.8.2", optional = true }
tauri = { version = "=2.11.5", features = ["unstable"] }
tokio = { version = "1.49.0", features = ["sync", "time"] }
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSError", "NSString", "NSURL", "NSURLRequest", "NSURLResponse"] }
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace"] }
objc2-web-kit = { version = "0.3.2", features = ["WKNavigation", "WKNavigationAction", "WKNavigationResponse", "WKNavigationDelegate", "WKPreferences", "WKUIDelegate", "WKUserContentController", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
