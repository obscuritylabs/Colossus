[package]
publish = false
name = "colossus-desktop"
version = "0.1.0"
description = "Security-first Tauri desktop interface for Colossus"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/obscuritylabs/Colossus"

[workspace]
members = ["../native-credential-ui", "../native-browser"]

[features]
default = ["dictation"]
plugin-test-bridge = []
approval-test-bridge = []
browser-preview = []
windows-browser-functional-preview = ["browser-preview", "colossus-native-browser/windows-browser-functional-preview", "tauri/custom-protocol"]
embedded-chromium-preview = ["browser-preview", "colossus-native-browser/cef-preview"]
browser-test-bridge = ["browser-preview", "colossus-native-browser/native-test-driver"]
# Separate-host Debug lane: link only the native pixel adapter; never bootstrap
# an in-process CEF guest or fall back to a system webview for this lane.
# This standalone example has no Vite server. Embed the built renderer at compile
# time; clearing devUrl at runtime cannot restore assets omitted by Tauri codegen.
macos-contained-browser-diagnostic = ["browser-test-bridge", "colossus-native-browser/cef-preview", "tauri/custom-protocol"]
windows-browser-development = ["browser-test-bridge", "colossus-native-browser/cef-preview", "tauri/custom-protocol"]
dictation = ["dep:colossus-native-dictation", "colossus-native-dictation/download"]
dictation-preview = ["dictation"]
dictation-metal = ["dictation", "colossus-native-dictation/metal"]

[[example]]
name = "plugin-test-bridge"
required-features = ["plugin-test-bridge"]

[[example]]
name = "approval-test-bridge"
required-features = ["approval-test-bridge"]

[[example]]
name = "browser-acceptance"
required-features = ["browser-test-bridge"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lib]
name = "colossus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
async-trait = "0.1.89"
colossus-connector = { version = "=0.11.8", path = "../../../crates/colossus-connector" }
anyhow = "1.0.104"
base64 = "0.22.1"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
colossus-codex-auth = { version = "=0.11.8", path = "../../../crates/colossus-codex-auth" }
colossus-contracts = { version = "=0.11.8", path = "../../../crates/colossus-contracts" }
colossus-credentials = { version = "=0.11.8", path = "../../../crates/colossus-credentials" }
colossus-home = { version = "=0.11.8", path = "../../../crates/colossus-home" }
colossus-media = { version = "=0.11.8", path = "../../../crates/colossus-media" }
colossus-network = { version = "=0.11.8", path = "../../../crates/colossus-network" }
colossus-observability = { version = "=0.11.8", path = "../../../crates/colossus-observability", features = ["local-logs"] }
colossus-native-credential-ui = { version = "=0.1.0", path = "../native-credential-ui" }
colossus-native-browser = { version = "=0.1.0", path = "../native-browser" }
colossus-native-dictation = { version = "=0.1.0", path = "../../../crates/colossus-native-dictation", optional = true }
colossus-ports = { version = "=0.11.8", path = "../../../crates/colossus-ports" }
colossus-plugins = { version = "=0.11.8", path = "../../../crates/colossus-plugins" }
colossus-sdk = { version = "=0.11.8", path = "../../../crates/colossus-sdk", features = ["daemon", "keyring", "sidecar"] }
colossus-sidecar-protocol = { version = "=0.11.8", path = "../../../crates/colossus-sidecar-protocol" }
colossus-worker-protocol = { version = "=0.11.8", path = "../../../crates/colossus-worker-protocol" }
directories = "6.0.0"
futures-util = "0.3.33"
getrandom = "0.4.3"
hex = "0.4.3"
minisign-verify = "0.2.5"
portable-pty = "0.9.0"
redb = "4.1.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.29"
sha2 = "0.10.9"
tauri = { version = "=2.12.4", features = ["unstable"] }
tauri-plugin-dialog = "2.7.2"
# Shipped Windows updates are signed raw NSIS installers; legacy ZIP extraction is disabled.
tauri-plugin-updater = { version = "=2.9.0", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1.44"
tempfile = "3.23.0"
url = "2.5.8"
fs4 = "0.13.1"
uuid = { version = "1.23.4", features = ["v4", "v7"] }
zeroize = { version = "1.8.2", features = ["serde"] }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["process", "signal"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
colossus-windows-native = { version = "=0.11.8", path = "../../../crates/colossus-windows-native" }
keyring-core = "=1.0.0"
windows-native-keyring-store = "=1.1.0"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
notify-rust = { version = "=4.18.1", default-features = false }

[dev-dependencies]
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.23.0"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
keyring-core = "=1.0.0"
apple-native-keyring-store = { version = "=1.0.1", features = ["keychain"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

# Match Core's authenticated Retina-frame hashing within the existing lease.
[profile.dev.package.sha2]
opt-level = 3
