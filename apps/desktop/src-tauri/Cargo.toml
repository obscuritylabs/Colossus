[package]
publish = false
name = "colossus-desktop"
version = "0.1.0"
description = "Security-first Tauri desktop interface for Colossus"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/obscuritylabs/Colossus"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lib]
name = "colossus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
colossus-codex-auth = { version = "=0.10.10-preview.2", path = "../../../crates/colossus-codex-auth" }
colossus-home = { version = "=0.10.10-preview.2", path = "../../../crates/colossus-home" }
colossus-network = { version = "=0.10.10-preview.2", path = "../../../crates/colossus-network" }
colossus-sdk = { version = "=0.10.10-preview.2", path = "../../../crates/colossus-sdk", features = ["daemon", "keyring", "sidecar"] }
colossus-sidecar-protocol = { version = "=0.10.10-preview.2", path = "../../../crates/colossus-sidecar-protocol" }
colossus-worker-protocol = { version = "=0.10.10-preview.2", path = "../../../crates/colossus-worker-protocol" }
directories = "6.0.0"
futures-util = "0.3.33"
getrandom = "0.4.3"
hex = "0.4.3"
keyring = "4.1.4"
minisign-verify = "0.2.5"
portable-pty = "0.9.0"
redb = "4.1.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.29"
sha2 = "0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = { version = "=2.9.0", default-features = false, features = ["rustls-tls", "zip"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
uuid = { version = "1.23.4", features = ["v4", "v7"] }
zeroize = { version = "1.8.2", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["process", "signal"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
colossus-windows-native = { version = "=0.10.10-preview.2", path = "../../../crates/colossus-windows-native" }

[dev-dependencies]
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.23.0"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
