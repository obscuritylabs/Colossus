[package]
name = "colossus-desktop"
version = "0.1.0"
description = "Security-first Tauri desktop interface for Colossus"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/obscuritylabs/Colossus"

[workspace]

[lib]
name = "colossus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
colossus-sdk = { version = "=0.10.1-preview.2", path = "../../../crates/colossus-sdk", features = ["daemon", "keyring", "sidecar"] }
colossus-sidecar-protocol = { version = "=0.10.1-preview.2", path = "../../../crates/colossus-sidecar-protocol" }
directories = "6.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
keyring = "4.1.4"
nix = { version = "0.31.3", features = ["process", "signal"] }
portable-pty = "0.9.0"
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tokio = { version = "1.49.0", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1.23.4", features = ["v4", "v7"] }
zeroize = { version = "1.8.2", features = ["serde"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
