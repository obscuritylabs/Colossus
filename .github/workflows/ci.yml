name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, lint, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run tests
        run: uv run pytest

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src/colossus

      - name: Validate Conventional Commit message
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "$PR_TITLE" | uv run python scripts/check_conventional_commit.py --stdin
          else
            git log -1 --pretty=%B | uv run python scripts/check_conventional_commit.py --stdin
          fi

      - name: Build package
        run: uv run python -m build
