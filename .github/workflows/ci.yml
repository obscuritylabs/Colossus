name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python legacy checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run tests
        run: uv run pytest

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src/colossus

      - name: Validate Conventional Commit message
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "$PR_TITLE" | uv run python scripts/check_conventional_commit.py --stdin
          else
            git log -1 --pretty=%B | uv run python scripts/check_conventional_commit.py --stdin
          fi

      - name: Build package
        run: uv run python -m build

  rust:
    name: Rust format, Clippy, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check independent fuzz harness formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Lint locked fuzz harnesses on stable
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings

  rust-portability:
    name: Rust portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Compile every target
        run: cargo check --locked --workspace --all-targets

  rust-native-sandbox:
    name: Rust native sandbox (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache native sandbox target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: native-sandbox-${{ matrix.runner }}

      - name: Run native isolation and escape acceptance
        run: cargo test --locked -p colossus-cli --test native_sandbox -- --nocapture

  rust-windows-runtime:
    name: Rust Windows named pipe and fail-closed sandbox (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2025
          - windows-11-arm
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache Windows runtime target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: windows-runtime-${{ matrix.runner }}

      - name: Run authenticated named-pipe and process fail-closed acceptance
        run: >-
          cargo test --locked -p colossus-cli
          --test worker_smoke --test windows_sandbox -- --nocapture

  rust-fuzz:
    name: Rust bounded libFuzzer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rust
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10

      - name: Cache fuzz dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fuzz -> target

      - name: Install cargo-fuzz 0.13.2
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run bounded security parser fuzzing
        run: |
          set -euo pipefail
          for target in contracts_json workflow_yaml workflow_condition; do
            cargo fuzz run "$target" -- \
              -runs=5000 \
              -max_len=65536 \
              -timeout=10 \
              -rss_limit_mb=2048 \
              -print_final_stats=1
          done

      - name: Upload minimized crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colossus-fuzz-artifacts
          path: rust/fuzz/artifacts/
          if-no-files-found: ignore

  rust-supply-chain:
    name: Rust dependency, license, and vulnerability policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: rust
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install pinned supply-chain tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Enforce production dependency policy
        run: |
          cargo deny --locked check -A license-not-encountered licenses sources bans
          cargo deny --locked check -D warnings advisories
          cargo audit -D warnings --file Cargo.lock

      - name: Enforce fuzz dependency policy
        run: |
          cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check -A license-not-encountered licenses sources bans
          cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check -D warnings advisories
          cargo audit -D warnings --file fuzz/Cargo.lock

  rust-release-smoke:
    name: Rust release artifact (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: [rust, rust-supply-chain]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96 and target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools file

      - name: Cache release target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: release-${{ matrix.target }}

      - name: Build locked release binary
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          --package colossus-cli --bin colossus-rs

      - name: Prove static Linux linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          file target/${{ matrix.target }}/release/colossus-rs | tee binary-file.txt
          grep -Eq 'static(-pie)? linked|statically linked' binary-file.txt

      - name: Execute offline artifact smoke on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          COLOSSUS_RELEASE_JOURNAL_KEY: "5555555555555555555555555555555555555555555555555555555555555555"
          COLOSSUS_RELEASE_SIGNING_KEY: "6666666666666666666666666666666666666666666666666666666666666666"
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/rust/target/${{ matrix.target }}/release/colossus-rs"
          smoke="$RUNNER_TEMP/colossus-release-smoke-${{ matrix.target }}"
          rm -rf "$smoke"
          mkdir -p "$smoke/workflows"
          cp release/smoke-config.yaml "$smoke/config.yaml"
          cd "$smoke"
          version_output=$("$binary" --version)
          case "$version_output" in
            "colossus "*) ;;
            *) echo "unexpected command identity: $version_output" >&2; exit 1 ;;
          esac
          "$binary" --config config.yaml config show >/dev/null
          "$binary" --config config.yaml run connected >result.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("result.json").read_text())
          assert result["output"] == "connected", result
          assert result["profile"] == "echo", result
          assert result["event_count"] >= 3, result
          PY
          "$binary" --config config.yaml audit verify >audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("audit.json").read_text())
          assert audit["last_sequence"] >= 1, audit
          assert audit["checkpoint"]["global_sequence"] == audit["last_sequence"], audit
          PY

      - name: Execute offline artifact smoke on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COLOSSUS_RELEASE_JOURNAL_KEY: "5555555555555555555555555555555555555555555555555555555555555555"
          COLOSSUS_RELEASE_SIGNING_KEY: "6666666666666666666666666666666666666666666666666666666666666666"
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $env:GITHUB_WORKSPACE "rust/target/${{ matrix.target }}/release/colossus-rs.exe"
          $smoke = Join-Path $env:RUNNER_TEMP "colossus-release-smoke-${{ matrix.target }}"
          Remove-Item -Recurse -Force $smoke -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $smoke "workflows") | Out-Null
          Copy-Item release/smoke-config.yaml (Join-Path $smoke "config.yaml")
          Push-Location $smoke
          try {
            $versionOutput = (& $binary --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "version command failed" }
            if (-not $versionOutput.StartsWith("colossus ")) {
              throw "unexpected command identity: $versionOutput"
            }
            & $binary --config config.yaml config show | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "config validation failed" }
            & $binary --config config.yaml run connected | Set-Content -Encoding utf8 result.json
            if ($LASTEXITCODE -ne 0) { throw "offline run failed" }
            $result = Get-Content -Raw result.json | ConvertFrom-Json
            if ($result.output -ne "connected" -or $result.profile -ne "echo" -or $result.event_count -lt 3) {
              throw "unexpected run result: $($result | ConvertTo-Json -Compress)"
            }
            & $binary --config config.yaml audit verify | Set-Content -Encoding utf8 audit.json
            if ($LASTEXITCODE -ne 0) { throw "audit verification failed" }
            $audit = Get-Content -Raw audit.json | ConvertFrom-Json
            if ($audit.last_sequence -lt 1 -or $audit.checkpoint.global_sequence -ne $audit.last_sequence) {
              throw "unexpected audit result: $($audit | ConvertTo-Json -Compress)"
            }
          } finally {
            Pop-Location
          }

      - name: Package checksummed Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "colossus-cli"))')
          package="colossus-$version-${{ matrix.target }}"
          stage="$RUNNER_TEMP/$package"
          rm -rf "$stage"
          mkdir -p "$stage" dist
          install -m 0755 target/${{ matrix.target }}/release/colossus-rs "$stage/colossus"
          cp ../LICENSE "$stage/LICENSE"
          cp README.md "$stage/README.md"
          tar -C "$RUNNER_TEMP" -czf "dist/$package.tar.gz" "$package"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$package.tar.gz" >"$package.tar.gz.sha256"
          else
            shasum -a 256 "$package.tar.gz" >"$package.tar.gz.sha256"
          fi

      - name: Package checksummed Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "colossus-cli").version
          $package = "colossus-$version-${{ matrix.target }}"
          $stage = Join-Path $env:RUNNER_TEMP $package
          $dist = Join-Path $PWD "dist"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage, $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/colossus-rs.exe" (Join-Path $stage "colossus.exe")
          Copy-Item ../LICENSE (Join-Path $stage "LICENSE")
          Copy-Item README.md (Join-Path $stage "README.md")
          $archive = Join-Path $dist "$package.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Encoding ascii "${archive}.sha256"

      - name: Upload release artifact and checksum
        uses: actions/upload-artifact@v4
        with:
          name: colossus-${{ matrix.target }}
          path: rust/dist/colossus-*-${{ matrix.target }}.${{ matrix.archive }}*
          if-no-files-found: error
          compression-level: 0

  rust-live-chroma:
    name: Rust live Chroma ${{ matrix.chroma }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - chroma: "1.5.8"
            image: chromadb/chroma:1.5.8@sha256:607103123fbd79794e3cd8029e16137031a464551e3a61df77191627a9d23c72
          - chroma: "1.5.9"
            image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Start pinned Chroma release
        run: |
          docker run --detach --rm --name colossus-chroma \
            --publish 127.0.0.1:8000:8000 \
            ${{ matrix.image }}
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v2/heartbeat >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs colossus-chroma
          exit 1

      - name: Run live Chroma v2 compatibility suite
        env:
          COLOSSUS_CHROMA_URL: http://127.0.0.1:8000
        run: cargo test --locked -p colossus-memory-chroma --test chroma_live -- --ignored

      - name: Stop Chroma
        if: always()
        run: |
          docker logs colossus-chroma || true
          docker stop colossus-chroma || true

  rust-live-security:
    name: Rust live OCI (Docker/Podman) and OPA security
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: rust
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install static proxy and Podman prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools podman
          rustup target add x86_64-unknown-linux-musl

      - name: Build immutable OCI allowlist proxy
        id: build-proxy
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl \
            --package colossus-sandbox --bin colossus-oci-proxy
          docker build --file oci-proxy.Dockerfile \
            --build-arg TARGET_TRIPLE=x86_64-unknown-linux-musl \
            --tag colossus-oci-proxy:acceptance .
          PROXY_IMAGE=$(docker image inspect colossus-oci-proxy:acceptance --format '{{.Id}}')
          echo "image=$PROXY_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Preload immutable OCI acceptance image
        run: docker pull python:3.13-slim@sha256:e544a7fcbdf8555eceda66bf86cafb006c736339f76141918bcb812f3174c00a

      - name: Run live OCI escape and recovery suite
        env:
          COLOSSUS_OCI_RUNTIME: /usr/bin/docker
          COLOSSUS_OCI_IMAGE: python:3.13-slim@sha256:e544a7fcbdf8555eceda66bf86cafb006c736339f76141918bcb812f3174c00a
          COLOSSUS_OCI_PROXY_IMAGE: ${{ steps.build-proxy.outputs.image }}
        run: cargo test --locked -p colossus-cli --test oci_sandbox -- --ignored

      - name: Preload Podman images
        id: podman-images
        run: |
          podman version
          podman pull python:3.13-slim@sha256:e544a7fcbdf8555eceda66bf86cafb006c736339f76141918bcb812f3174c00a
          docker save --output /tmp/colossus-oci-proxy.tar colossus-oci-proxy:acceptance
          podman load --input /tmp/colossus-oci-proxy.tar
          PROXY_IMAGE=$(podman image inspect colossus-oci-proxy:acceptance --format '{{.Id}}')
          case "$PROXY_IMAGE" in
            sha256:*) ;;
            *) PROXY_IMAGE="sha256:$PROXY_IMAGE" ;;
          esac
          echo "proxy=$PROXY_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Run live Podman escape and recovery suite
        env:
          COLOSSUS_OCI_RUNTIME: /usr/bin/podman
          COLOSSUS_OCI_IMAGE: python:3.13-slim@sha256:e544a7fcbdf8555eceda66bf86cafb006c736339f76141918bcb812f3174c00a
          COLOSSUS_OCI_PROXY_IMAGE: ${{ steps.podman-images.outputs.proxy }}
        run: cargo test --locked -p colossus-cli --test oci_sandbox -- --ignored

      - name: Install checksum-verified OPA 1.16.2
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/opa \
            https://github.com/open-policy-agent/opa/releases/download/v1.16.2/opa_linux_amd64_static
          echo "4ab4b89c131e6df3fed28b0b164083b6641ad67c86ab4c12d417ecfb93838ef1  /tmp/opa" \
            | sha256sum --check --strict
          chmod 0755 /tmp/opa

      - name: Run live OPA and mTLS suite
        env:
          COLOSSUS_OPA_BIN: /tmp/opa
          COLOSSUS_OPENSSL_BIN: /usr/bin/openssl
        run: cargo test --locked -p colossus-policy --test opa_live -- --ignored
