name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quick:
    name: Rust quick validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Conventional Commit message
        shell: bash
        run: git log -1 --pretty=%B | ./scripts/check_conventional_commit.sh --stdin

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-targets: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check independent fuzz harness formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

      - name: Compile locked workspace
        run: cargo check --locked --workspace --all-targets

      - name: Compile locked fuzz harnesses
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets

  rust-preflight:
    name: Rust formatting and configuration preflight
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Conventional Commit message
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "$PR_TITLE" | ./scripts/check_conventional_commit.sh --stdin
          else
            git log -1 --pretty=%B | ./scripts/check_conventional_commit.sh --stdin
          fi

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check independent fuzz harness formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

      - name: Validate locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Validate locked fuzz metadata
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --no-deps --format-version 1 >/dev/null

  rust:
    name: Rust Clippy and tests
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: rust-preflight
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-targets: false

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Lint locked fuzz harnesses on stable
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings

  rust-native-sandbox:
    name: Rust native sandbox (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: rust-preflight
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache native sandbox target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-sandbox-${{ matrix.runner }}
          cache-targets: false

      - name: Run native isolation and escape acceptance
        run: cargo test --locked -p colossus-cli --test native_sandbox -- --nocapture

  rust-windows-runtime:
    name: Rust Windows named pipe and AppContainer sandbox (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: rust-preflight
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2025
          - windows-11-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache Windows runtime target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: windows-runtime-${{ matrix.runner }}
          cache-targets: false

      - name: Run authenticated named-pipe and AppContainer escape acceptance
        run: >-
          cargo test --locked -p colossus-cli
          --test worker_smoke --test windows_sandbox -- --nocapture

  rust-fuzz:
    name: Rust bounded libFuzzer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rust-preflight
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache fuzz dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          cache-targets: false

      - name: Install cargo-fuzz 0.13.2
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run bounded security parser fuzzing
        run: |
          set -euo pipefail
          for target in contracts_json workflow_yaml workflow_condition; do
            cargo +nightly-2026-07-10 fuzz run "$target" -- \
              -runs=5000 \
              -max_len=65536 \
              -timeout=10 \
              -rss_limit_mb=2048 \
              -print_final_stats=1
          done

      - name: Upload minimized crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colossus-fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  rust-supply-chain:
    name: Rust dependency, license, and vulnerability policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: rust-preflight
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Install checksum-verified pinned supply-chain tools
        uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
          fallback: none

      - name: Enforce production dependency policy
        run: |
          cargo deny --locked check -A license-not-encountered licenses sources bans
          cargo deny --locked check -D warnings advisories
          cargo audit -D warnings --file Cargo.lock

      - name: Enforce fuzz dependency policy
        run: |
          cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check -A license-not-encountered licenses sources bans
          cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check -D warnings advisories
          cargo audit --no-fetch -D warnings --file fuzz/Cargo.lock

  rust-release-smoke:
    name: Rust release artifact (${{ matrix.target }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: rust-preflight
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96 and target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools file

      - name: Cache release target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-${{ matrix.target }}
          cache-targets: false

      - name: Build locked release binary
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          --package colossus-cli --bin colossus

      - name: Prove static Linux linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          file target/${{ matrix.target }}/release/colossus | tee binary-file.txt
          grep -Eq 'static(-pie)? linked|statically linked' binary-file.txt

      - name: Execute offline artifact smoke on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          COLOSSUS_RELEASE_JOURNAL_KEY: "5555555555555555555555555555555555555555555555555555555555555555"
          COLOSSUS_RELEASE_SIGNING_KEY: "6666666666666666666666666666666666666666666666666666666666666666"
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/colossus"
          smoke="$RUNNER_TEMP/colossus-release-smoke-${{ matrix.target }}"
          rm -rf "$smoke"
          mkdir -p "$smoke/workflows"
          cp release/smoke-config.yaml "$smoke/config.yaml"
          cd "$smoke"
          version_output=$("$binary" --version)
          case "$version_output" in
            "colossus "*) ;;
            *) echo "unexpected command identity: $version_output" >&2; exit 1 ;;
          esac
          "$binary" --config config.yaml config show >/dev/null
          "$binary" --config config.yaml run connected >result.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("result.json").read_text())
          assert result["output"] == "connected", result
          assert result["profile"] == "echo", result
          assert result["event_count"] >= 3, result
          PY
          "$binary" --config config.yaml audit verify >audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("audit.json").read_text())
          assert audit["last_sequence"] >= 1, audit
          assert audit["checkpoint"]["global_sequence"] == audit["last_sequence"], audit
          PY

      - name: Execute offline artifact smoke on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COLOSSUS_RELEASE_JOURNAL_KEY: "5555555555555555555555555555555555555555555555555555555555555555"
          COLOSSUS_RELEASE_SIGNING_KEY: "6666666666666666666666666666666666666666666666666666666666666666"
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $env:GITHUB_WORKSPACE "target/${{ matrix.target }}/release/colossus.exe"
          $smoke = Join-Path $env:RUNNER_TEMP "colossus-release-smoke-${{ matrix.target }}"
          Remove-Item -Recurse -Force $smoke -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $smoke "workflows") | Out-Null
          Copy-Item release/smoke-config.yaml (Join-Path $smoke "config.yaml")
          Push-Location $smoke
          try {
            $versionOutput = (& $binary --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "version command failed" }
            if (-not $versionOutput.StartsWith("colossus ")) {
              throw "unexpected command identity: $versionOutput"
            }
            & $binary --config config.yaml config show | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "config validation failed" }
            & $binary --config config.yaml run connected | Set-Content -Encoding utf8 result.json
            if ($LASTEXITCODE -ne 0) { throw "offline run failed" }
            $result = Get-Content -Raw result.json | ConvertFrom-Json
            if ($result.output -ne "connected" -or $result.profile -ne "echo" -or $result.event_count -lt 3) {
              throw "unexpected run result: $($result | ConvertTo-Json -Compress)"
            }
            & $binary --config config.yaml audit verify | Set-Content -Encoding utf8 audit.json
            if ($LASTEXITCODE -ne 0) { throw "audit verification failed" }
            $audit = Get-Content -Raw audit.json | ConvertFrom-Json
            if ($audit.last_sequence -lt 1 -or $audit.checkpoint.global_sequence -ne $audit.last_sequence) {
              throw "unexpected audit result: $($audit | ConvertTo-Json -Compress)"
            }
          } finally {
            Pop-Location
          }

      - name: Package checksummed Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "colossus-cli"))')
          package="colossus-$version-${{ matrix.target }}"
          stage="$RUNNER_TEMP/$package"
          rm -rf "$stage"
          mkdir -p "$stage" dist
          install -m 0755 target/${{ matrix.target }}/release/colossus "$stage/colossus"
          install -m 0755 release/install.sh "$stage/install.sh"
          cp LICENSE "$stage/LICENSE"
          cp README.md "$stage/README.md"
          tar -C "$RUNNER_TEMP" -czf "dist/$package.tar.gz" "$package"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$package.tar.gz" >"$package.tar.gz.sha256"
          else
            shasum -a 256 "$package.tar.gz" >"$package.tar.gz.sha256"
          fi

      - name: Package checksummed Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "colossus-cli").version
          $package = "colossus-$version-${{ matrix.target }}"
          $stage = Join-Path $env:RUNNER_TEMP $package
          $dist = Join-Path $PWD "dist"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage, $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/colossus.exe" (Join-Path $stage "colossus.exe")
          Copy-Item release/install.ps1 (Join-Path $stage "install.ps1")
          Copy-Item LICENSE (Join-Path $stage "LICENSE")
          Copy-Item README.md (Join-Path $stage "README.md")
          $archive = Join-Path $dist "$package.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Encoding ascii "${archive}.sha256"

      - name: Install packaged Unix artifact offline
        if: runner.os != 'Windows'
        shell: bash
        env:
          COLOSSUS_RELEASE_JOURNAL_KEY: "7777777777777777777777777777777777777777777777777777777777777777"
          COLOSSUS_RELEASE_SIGNING_KEY: "8888888888888888888888888888888888888888888888888888888888888888"
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/colossus-*-${{ matrix.target }}.tar.gz)
          test "${#archives[@]}" -eq 1
          archive=${archives[0]}
          extract="$RUNNER_TEMP/colossus-install-extract-${{ matrix.target }}"
          prefix="$RUNNER_TEMP/colossus-install-prefix-${{ matrix.target }}"
          smoke="$RUNNER_TEMP/colossus-install-smoke-${{ matrix.target }}"
          rm -rf "$extract" "$prefix" "$smoke"
          mkdir -p "$extract" "$smoke/workflows"
          tar -xzf "$archive" -C "$extract"
          packages=("$extract"/colossus-*)
          test "${#packages[@]}" -eq 1
          package=${packages[0]}
          test -d "$package"
          "$package/install.sh" --prefix "$prefix"
          cp release/smoke-config.yaml "$smoke/config.yaml"
          cd "$smoke"
          "$prefix/bin/colossus" --version | grep '^colossus '
          "$prefix/bin/colossus" --config config.yaml run installed-offline >result.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("result.json").read_text())
          assert result["output"] == "installed-offline", result
          assert result["profile"] == "echo", result
          assert result["event_count"] >= 3, result
          PY
          "$prefix/bin/colossus" --config config.yaml audit verify >audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("audit.json").read_text())
          assert audit["last_sequence"] >= 1, audit
          assert audit["checkpoint"]["global_sequence"] == audit["last_sequence"], audit
          PY

      - name: Install packaged Windows artifact offline
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COLOSSUS_RELEASE_JOURNAL_KEY: "7777777777777777777777777777777777777777777777777777777777777777"
          COLOSSUS_RELEASE_SIGNING_KEY: "8888888888888888888888888888888888888888888888888888888888888888"
        run: |
          $ErrorActionPreference = "Stop"
          $archives = @(Get-ChildItem "dist/colossus-*-${{ matrix.target }}.zip")
          if ($archives.Count -ne 1) { throw "expected exactly one release archive" }
          $extract = Join-Path $env:RUNNER_TEMP "colossus-install-extract-${{ matrix.target }}"
          $prefix = Join-Path $env:RUNNER_TEMP "colossus-install-prefix-${{ matrix.target }}"
          $smoke = Join-Path $env:RUNNER_TEMP "colossus-install-smoke-${{ matrix.target }}"
          Remove-Item -Recurse -Force $extract, $prefix, $smoke -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extract
          $packages = @(Get-ChildItem -LiteralPath $extract -Directory)
          if ($packages.Count -ne 1) { throw "archive must contain exactly one package directory" }
          & (Join-Path $packages[0].FullName "install.ps1") -Prefix $prefix
          New-Item -ItemType Directory -Force (Join-Path $smoke "workflows") | Out-Null
          Copy-Item release/smoke-config.yaml (Join-Path $smoke "config.yaml")
          $binary = Join-Path $prefix "bin/colossus.exe"
          Push-Location $smoke
          try {
            $versionOutput = (& $binary --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $versionOutput.StartsWith("colossus ")) {
              throw "installed version command failed: $versionOutput"
            }
            & $binary --config config.yaml run installed-offline | Set-Content -Encoding utf8 result.json
            if ($LASTEXITCODE -ne 0) { throw "installed offline run failed" }
            $result = Get-Content -Raw result.json | ConvertFrom-Json
            if ($result.output -ne "installed-offline" -or $result.profile -ne "echo" -or $result.event_count -lt 3) {
              throw "unexpected installed run result: $($result | ConvertTo-Json -Compress)"
            }
            & $binary --config config.yaml audit verify | Set-Content -Encoding utf8 audit.json
            if ($LASTEXITCODE -ne 0) { throw "installed audit verification failed" }
            $audit = Get-Content -Raw audit.json | ConvertFrom-Json
            if ($audit.last_sequence -lt 1 -or $audit.checkpoint.global_sequence -ne $audit.last_sequence) {
              throw "unexpected installed audit result: $($audit | ConvertTo-Json -Compress)"
            }
          } finally {
            Pop-Location
          }

      - name: Build and install signed bundle offline on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          COLOSSUS_BUNDLE_JOURNAL_KEY: "9999999999999999999999999999999999999999999999999999999999999999"
          COLOSSUS_BUNDLE_CHECKPOINT_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          COLOSSUS_BUNDLE_SIGNING_SEED: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/colossus"
          root="$RUNNER_TEMP/colossus-bundle-smoke-${{ matrix.target }}"
          stage="$root/stage"
          bundle="$root/bundle"
          prefix="$root/prefix"
          rm -rf "$root"
          mkdir -p "$stage/artifacts/${{ matrix.target }}" "$root/workflows"
          install -m 0755 "$binary" "$stage/artifacts/${{ matrix.target }}/colossus"
          cp "$GITHUB_WORKSPACE/LICENSE" "$stage/LICENSE"
          export BUNDLE_SMOKE_ROOT="$root"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["BUNDLE_SMOKE_ROOT"]).resolve()
          config = {
              "schemaVersion": 1,
              "storage": {
                  "path": str(root / "state.redb"),
                  "keys": {
                      "kind": "environment",
                      "journal_variable": "COLOSSUS_BUNDLE_JOURNAL_KEY",
                      "journal_key_id": "release-bundle-journal-v1",
                      "signing_variable": "COLOSSUS_BUNDLE_CHECKPOINT_KEY",
                      "anchor_path": str(root / "anchor.json"),
                  },
              },
              "policy": {
                  "kind": "built_in",
                  "allow_actions": [],
                  "approval_actions": [],
                  "require_post_effect": True,
              },
              "workflows": {
                  "repository": str(root / "workflows"),
                  "user": str(root / "workflows"),
              },
              "providers": {
                  "profiles": {
                      "echo": {
                          "kind": "echo",
                          "model": "echo",
                          "baseUrl": None,
                          "credentialReference": None,
                          "timeoutMs": 5000,
                      }
                  },
                  "roles": {"primary": "echo"},
              },
              "agent": {"maxTurns": 2, "tools": ["echo"]},
              "subagents": {"maxConcurrent": 1},
              "sandbox": {
                  "backend": "native",
                  "profile": "release-bundle-smoke-v1",
                  "allowBrokerFallback": False,
                  "helperPath": None,
                  "ociRuntime": None,
                  "ociImage": None,
                  "ociProxyImage": None,
                  "filesystem": [{"root": str(root), "mode": "write"}],
                  "executables": [],
                  "environment": [],
                  "networkDestinations": [],
                  "timeoutMs": 30000,
                  "maxOutputBytes": 1048576,
                  "maxProcesses": 1,
                  "maxMemoryBytes": 67108864,
                  "maxConcurrency": 1,
              },
          }
          (root / "config.yaml").write_text(json.dumps(config), encoding="utf-8")
          PY
          config="$root/config.yaml"
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "colossus-cli"))')
          "$binary" --config "$config" --approval-mode full-access bundle key-info \
            --signing-key-reference env:COLOSSUS_BUNDLE_SIGNING_SEED >"$root/key.json"
          public=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["public_key"])' "$root/key.json")
          "$binary" --config "$config" --approval-mode full-access packs trust add colossus \
            --public-key "$public" >/dev/null
          "$binary" --config "$config" --approval-mode full-access bundle build \
            "$stage" "$bundle" --name colossus-offline \
            --version "$version" --publisher colossus \
            --created-at 2026-07-11T00:00:00Z \
            --source-revision "$GITHUB_SHA" \
            --signing-key-reference env:COLOSSUS_BUNDLE_SIGNING_SEED >"$root/build.json"
          "$binary" --config "$config" bundle verify "$bundle" >/dev/null
          "$binary" --config "$config" --approval-mode full-access bundle install \
            "$bundle" --prefix "$prefix" >"$root/install.json"
          installed="$prefix/bin/colossus"
          "$installed" --config "$config" run bundle-installed >"$root/result.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["BUNDLE_SMOKE_ROOT"])
          build = json.loads((root / "build.json").read_text())
          install = json.loads((root / "install.json").read_text())
          result = json.loads((root / "result.json").read_text())
          assert build["targets"] == ["${{ matrix.target }}"], build
          assert install["target"] == "${{ matrix.target }}", install
          assert result["output"] == "bundle-installed", result
          PY
          "$installed" --config "$config" audit verify >/dev/null

      - name: Build and install signed bundle offline on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COLOSSUS_BUNDLE_JOURNAL_KEY: "9999999999999999999999999999999999999999999999999999999999999999"
          COLOSSUS_BUNDLE_CHECKPOINT_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          COLOSSUS_BUNDLE_SIGNING_SEED: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $env:GITHUB_WORKSPACE "target/${{ matrix.target }}/release/colossus.exe"
          $root = Join-Path $env:RUNNER_TEMP "colossus-bundle-smoke-${{ matrix.target }}"
          $stage = Join-Path $root "stage"
          $bundle = Join-Path $root "bundle"
          $prefix = Join-Path $root "prefix"
          $workflows = Join-Path $root "workflows"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          $artifactDirectory = Join-Path $stage "artifacts/${{ matrix.target }}"
          New-Item -ItemType Directory -Force $artifactDirectory, $workflows | Out-Null
          Copy-Item $binary (Join-Path $artifactDirectory "colossus.exe")
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "LICENSE") (Join-Path $stage "LICENSE")
          $config = [ordered]@{
            schemaVersion = 1
            storage = [ordered]@{
              path = (Join-Path $root "state.redb")
              keys = [ordered]@{
                kind = "environment"
                journal_variable = "COLOSSUS_BUNDLE_JOURNAL_KEY"
                journal_key_id = "release-bundle-journal-v1"
                signing_variable = "COLOSSUS_BUNDLE_CHECKPOINT_KEY"
                anchor_path = (Join-Path $root "anchor.json")
              }
            }
            policy = [ordered]@{
              kind = "built_in"
              allow_actions = @()
              approval_actions = @()
              require_post_effect = $true
            }
            workflows = [ordered]@{ repository = $workflows; user = $workflows }
            providers = [ordered]@{
              profiles = [ordered]@{
                echo = [ordered]@{
                  kind = "echo"
                  model = "echo"
                  baseUrl = $null
                  credentialReference = $null
                  timeoutMs = 5000
                }
              }
              roles = [ordered]@{ primary = "echo" }
            }
            agent = [ordered]@{ maxTurns = 2; tools = @("echo") }
            subagents = [ordered]@{ maxConcurrent = 1 }
            sandbox = [ordered]@{
              backend = "native"
              profile = "release-bundle-smoke-v1"
              allowBrokerFallback = $false
              helperPath = $null
              ociRuntime = $null
              ociImage = $null
              ociProxyImage = $null
              filesystem = @([ordered]@{ root = $root; mode = "write" })
              executables = @()
              environment = @()
              networkDestinations = @()
              timeoutMs = 30000
              maxOutputBytes = 1048576
              maxProcesses = 1
              maxMemoryBytes = 67108864
              maxConcurrency = 1
            }
          }
          $configPath = Join-Path $root "config.yaml"
          $config | ConvertTo-Json -Depth 12 | Set-Content -Encoding utf8 $configPath
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "colossus-cli").version
          $keyInfo = & $binary --config $configPath --approval-mode full-access bundle key-info `
            --signing-key-reference env:COLOSSUS_BUNDLE_SIGNING_SEED | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "bundle key-info failed" }
          & $binary --config $configPath --approval-mode full-access packs trust add colossus `
            --public-key $keyInfo.public_key | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "bundle trust failed" }
          $build = & $binary --config $configPath --approval-mode full-access bundle build `
            $stage $bundle --name colossus-offline --version $version `
            --publisher colossus --created-at 2026-07-11T00:00:00Z `
            --source-revision $env:GITHUB_SHA `
            --signing-key-reference env:COLOSSUS_BUNDLE_SIGNING_SEED | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "bundle build failed" }
          & $binary --config $configPath bundle verify $bundle | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "bundle verify failed" }
          $install = & $binary --config $configPath --approval-mode full-access bundle install `
            $bundle --prefix $prefix | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "bundle install failed" }
          $installed = Join-Path $prefix "bin/colossus.exe"
          $result = & $installed --config $configPath run bundle-installed | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "bundle-installed run failed" }
          if ($build.targets.Count -ne 1 -or $build.targets[0] -ne "${{ matrix.target }}") {
            throw "unexpected bundle targets"
          }
          if ($install.target -ne "${{ matrix.target }}" -or $result.output -ne "bundle-installed") {
            throw "unexpected bundle install result"
          }
          & $installed --config $configPath audit verify | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "bundle-installed audit verify failed" }

      - name: Upload release artifact and checksum
        uses: actions/upload-artifact@v4
        with:
          name: colossus-${{ matrix.target }}
          path: dist/colossus-*-${{ matrix.target }}.${{ matrix.archive }}*
          if-no-files-found: error
          compression-level: 0

  rust-live-chroma:
    name: Rust live Chroma ${{ matrix.chroma }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: rust-preflight
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - chroma: "1.5.8"
            image: chromadb/chroma:1.5.8@sha256:607103123fbd79794e3cd8029e16137031a464551e3a61df77191627a9d23c72
          - chroma: "1.5.9"
            image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-targets: false

      - name: Start pinned Chroma release
        run: |
          docker run --detach --rm --name colossus-chroma \
            --publish 127.0.0.1:8000:8000 \
            ${{ matrix.image }}
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v2/heartbeat >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs colossus-chroma
          exit 1

      - name: Run live Chroma v2 compatibility suite
        env:
          COLOSSUS_CHROMA_URL: http://127.0.0.1:8000
        run: cargo test --locked -p colossus-memory-chroma --test chroma_live -- --ignored

      - name: Stop Chroma
        if: always()
        run: |
          docker logs colossus-chroma || true
          docker stop colossus-chroma || true

  rust-live-storage:
    name: Rust live PostgreSQL and opt-in WORM storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: rust-preflight
    env:
      SCCACHE_GHA_ENABLED: "true"
    services:
      postgres:
        image: postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
        env:
          POSTGRES_DB: colossus
          POSTGRES_USER: colossus
          POSTGRES_PASSWORD: colossus-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colossus -d colossus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-targets: false

      - name: Run PostgreSQL concurrency, repository, projection, and kill-recovery suite
        env:
          COLOSSUS_TEST_POSTGRES_URL: postgresql://colossus:colossus-ci-only@127.0.0.1:5432/colossus?sslmode=disable
          COLOSSUS_TEST_POSTGRES_OUTAGE_URL: postgresql://colossus:credential-must-not-appear@127.0.0.1:1/colossus?sslmode=disable
        run: cargo test --locked -p colossus-journal-postgres -- --nocapture

      - name: Run configured live HTTPS WORM acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && vars.COLOSSUS_TEST_WORM_ENDPOINT != '' }}
        env:
          COLOSSUS_TEST_WORM_ENDPOINT: ${{ vars.COLOSSUS_TEST_WORM_ENDPOINT }}
          COLOSSUS_TEST_WORM_TOKEN: ${{ secrets.COLOSSUS_TEST_WORM_TOKEN }}
        run: |
          test -n "$COLOSSUS_TEST_WORM_TOKEN"
          cargo test --locked -p colossus-audit \
            live_https_worm_endpoint_accepts_idempotent_create_only_delivery -- --ignored --nocapture

  rust-live-security:
    name: Rust live OCI (Docker/Podman) and OPA security
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: rust-preflight
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-targets: false

      - name: Install static proxy and Podman prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools podman slirp4netns
          rustup target add x86_64-unknown-linux-musl

      - name: Build immutable OCI allowlist proxy
        id: build-proxy
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl \
            --package colossus-sandbox --bin colossus-oci-proxy
          docker build --file oci-proxy.Dockerfile \
            --build-arg TARGET_TRIPLE=x86_64-unknown-linux-musl \
            --tag colossus-oci-proxy:acceptance .
          PROXY_IMAGE=$(docker image inspect colossus-oci-proxy:acceptance --format '{{.Id}}')
          echo "image=$PROXY_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Preload immutable OCI acceptance image
        run: docker pull python:3.13-slim@sha256:e544a7fcbdf8555eceda66bf86cafb006c736339f76141918bcb812f3174c00a

      - name: Run live OCI escape and recovery suite
        env:
          COLOSSUS_OCI_RUNTIME: /usr/bin/docker
          COLOSSUS_OCI_IMAGE: python:3.13-slim@sha256:e544a7fcbdf8555eceda66bf86cafb006c736339f76141918bcb812f3174c00a
          COLOSSUS_OCI_PROXY_IMAGE: ${{ steps.build-proxy.outputs.image }}
        run: cargo test --locked -p colossus-cli --test oci_sandbox -- --ignored

      - name: Preload Podman images
        id: podman-images
        run: |
          podman version
          podman pull python:3.13-slim@sha256:e544a7fcbdf8555eceda66bf86cafb006c736339f76141918bcb812f3174c00a
          podman build --file oci-proxy.Dockerfile \
            --build-arg TARGET_TRIPLE=x86_64-unknown-linux-musl \
            --tag colossus-oci-proxy:acceptance .
          PROXY_IMAGE=$(podman image inspect colossus-oci-proxy:acceptance --format '{{.Id}}')
          case "$PROXY_IMAGE" in
            sha256:*) ;;
            *) PROXY_IMAGE="sha256:$PROXY_IMAGE" ;;
          esac
          echo "proxy=$PROXY_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Run live Podman escape and recovery suite
        env:
          COLOSSUS_OCI_RUNTIME: /usr/bin/podman
          COLOSSUS_OCI_IMAGE: python:3.13-slim@sha256:e544a7fcbdf8555eceda66bf86cafb006c736339f76141918bcb812f3174c00a
          COLOSSUS_OCI_PROXY_IMAGE: ${{ steps.podman-images.outputs.proxy }}
        run: cargo test --locked -p colossus-cli --test oci_sandbox -- --ignored

      - name: Install checksum-verified OPA 1.16.2
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/opa \
            https://github.com/open-policy-agent/opa/releases/download/v1.16.2/opa_linux_amd64_static
          echo "4ab4b89c131e6df3fed28b0b164083b6641ad67c86ab4c12d417ecfb93838ef1  /tmp/opa" \
            | sha256sum --check --strict
          chmod 0755 /tmp/opa

      - name: Run live OPA and mTLS suite
        env:
          COLOSSUS_OPA_BIN: /tmp/opa
          COLOSSUS_OPENSSL_BIN: /usr/bin/openssl
        run: cargo test --locked -p colossus-policy --test opa_live -- --ignored

  rust-pr-gate:
    name: Rust pull request validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs:
      - rust-preflight
      - rust
      - rust-native-sandbox
      - rust-windows-runtime
      - rust-fuzz
      - rust-supply-chain
      - rust-live-chroma
      - rust-live-storage
      - rust-live-security

    steps:
      - name: Require every Rust pull request matrix
        env:
          RUST_ACCEPTANCE_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RUST_ACCEPTANCE_RESULTS"])
          failed = {
              name: details.get("result")
              for name, details in results.items()
              if details.get("result") != "success"
          }
          for name, result in sorted(failed.items()):
              print(f"{name} pull request validation did not succeed: {result}", file=sys.stderr)
          raise SystemExit(bool(failed))
          PY

  rust-cutover-gate:
    name: Rust P0+P1 cutover gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs:
      - rust-preflight
      - rust
      - rust-native-sandbox
      - rust-windows-runtime
      - rust-fuzz
      - rust-supply-chain
      - rust-release-smoke
      - rust-live-chroma
      - rust-live-storage
      - rust-live-security

    steps:
      - name: Require every Rust acceptance matrix
        env:
          RUST_ACCEPTANCE_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RUST_ACCEPTANCE_RESULTS"])
          failed = {
              name: details.get("result")
              for name, details in results.items()
              if details.get("result") != "success"
          }
          for name, result in sorted(failed.items()):
              print(f"{name} acceptance did not succeed: {result}", file=sys.stderr)
          raise SystemExit(bool(failed))
          PY
