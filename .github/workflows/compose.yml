name: Compose deployment

on:
  pull_request:
    paths:
      - deploy/compose/**
      - deploy/control-plane/controlled-project.ps1
      - scripts/helm-local/hosted.ps1
      - docs/cloud/deployment/compose.md
      - .github/workflows/compose.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Offline Compose contracts (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ownership, PKI, retained keys, environment, and recovery boundaries
        shell: pwsh
        run: ./deploy/compose/test-contract.ps1 -ScratchDirectory $env:RUNNER_TEMP

  acceptance:
    name: Live Compose chat, streaming, restart, and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
      - name: Exercise the deployment adapter against the published compatibility baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Join-Path $env:RUNNER_TEMP 'colossus-compose'
          $helper = './deploy/compose/compose.ps1'
          # Runtime code has its own exact-head gates. This suite independently
          # checks the deployment adapter against a known published release.
          $release = 'v0.11.11-preview.5'
          try {
            & $helper -Action up -Name core -CoreOnly -ReleaseTag $release -StateDirectory $state
            & $helper -Action test -Name core -StateDirectory $state
            & $helper -Action down -Name core -RemoveData -StateDirectory $state -Confirm:$false
            & $helper -Action up -Name chat -ReleaseTag $release -StateDirectory $state
            & $helper -Action test -Name chat -StateDirectory $state
            $before = Get-Content (Join-Path $state 'compose-chat/verification.json') -Raw | ConvertFrom-Json
            & $helper -Action down -Name chat -StateDirectory $state
            & $helper -Action up -Name chat -StateDirectory $state
            & $helper -Action test -Name chat -StateDirectory $state
            $backup = Join-Path $state 'backups/chat.zip'
            & $helper -Action backup -Name chat -StateDirectory $state -Backup $backup
            & $helper -Action down -Name chat -StateDirectory $state
            & $helper -Action restore -Name recovered -StateDirectory $state -Backup $backup
            & $helper -Action test -Name recovered -StateDirectory $state
            $after = Get-Content (Join-Path $state 'compose-recovered/verification.json') -Raw | ConvertFrom-Json
            if ($before.threadId -cne $after.threadId -or $before.taskId -cne $after.taskId) {
              throw 'Restore did not retain the original conversation and task.'
            }
          } finally {
            foreach ($name in @('core','chat','recovered')) {
              if (Test-Path (Join-Path $state "compose-$name/manifest.json")) {
                & $helper -Action down -Name $name -RemoveData -StateDirectory $state -Confirm:$false
              }
            }
          }
