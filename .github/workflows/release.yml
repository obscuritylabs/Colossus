name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate without publishing, for example v0.10.0 or v0.10.1-preview.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    # Release readiness installs an exact-path AppArmor profile, which needs a kernel
    # that exposes the AppArmor securityfs interface. Blacksmith's microVM kernel does
    # not, so this lane stays on the GitHub-hosted larger runner.
    runs-on: ubuntu-latest-m
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
      source_commit: ${{ steps.request.outputs.source_commit }}
      source_date_epoch: ${{ steps.request.outputs.source_date_epoch }}
      sdk_base_tag: ${{ steps.request.outputs.sdk_base_tag }}
      publish_draft: ${{ steps.request.outputs.publish_draft }}
      release_channel: ${{ steps.request.outputs.release_channel }}
      target_channel: ${{ steps.request.outputs.target_channel }}
      prerelease: ${{ steps.request.outputs.prerelease }}
    steps:
      - name: Check out complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          key: release-readiness
          cache-targets: false

      - name: Install checksum-verified release tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
          fallback: none

      - name: Validate tag, version, changelog, and ancestry
        id: request
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            tag=$REF_NAME
            test "$(git cat-file -t "$tag")" = tag
            git fetch origin main
            tag_commit=$(git rev-list -n 1 "$tag")
            git merge-base --is-ancestor "$tag_commit" origin/main
            source_commit=$tag_commit
            publish_draft=true
          else
            tag=$DISPATCH_VERSION
            source_commit=$(git rev-parse HEAD)
            publish_draft=false
          fi
          if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            tag_channel=stable
            prerelease=false
          elif [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.([1-9][0-9]*)$ ]]; then
            tag_channel=developer_preview
            prerelease=true
          else
            echo 'release tag must be vX.Y.Z or vX.Y.Z-preview.N with N greater than zero' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = push ]; then
            release_channel=$tag_channel
          else
            release_channel=validation_only
            prerelease=false
          fi
          version=${tag#v}
          source_date_epoch=$(git show -s --format=%ct "$source_commit")
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]
          sdk_base_tag=$(
            while IFS= read -r candidate; do
              if [ "$candidate" != "$tag" ] &&
                [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                printf '%s\n' "$candidate"
              fi
            done < <(git tag --merged "$source_commit" --format='%(refname:short)') |
              sort -V |
              tail -n 1
          )
          test -n "$sdk_base_tag"
          git merge-base --is-ancestor \
            "$(git rev-list -n 1 "$sdk_base_tag")" "$source_commit"
          workspace_version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "colossus-cli") | .version')
          test "$version" = "$workspace_version"
          grep -F "## [$version]" CHANGELOG.md >/dev/null
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'source_commit=%s\n' "$source_commit"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
            printf 'sdk_base_tag=%s\n' "$sdk_base_tag"
            printf 'publish_draft=%s\n' "$publish_draft"
            printf 'release_channel=%s\n' "$release_channel"
            printf 'target_channel=%s\n' "$tag_channel"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare exact-path AppArmor profile for readiness tests
        run: |
          install_dir="/colossus-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          staged_binary="$install_dir/colossus"
          sudo install -d -o root -g root -m 0755 "$install_dir"
          sudo install -o root -g root -m 0755 /bin/true "$staged_binary"
          sudo release/install-apparmor.sh "$staged_binary"
          cargo build --locked -p colossus-cli --bin colossus
          sudo install -o root -g root -m 0755 \
            target/debug/colossus "$staged_binary"
          printf 'COLOSSUS_NATIVE_TEST_BINARY=%s\n' "$staged_binary" >> "$GITHUB_ENV"

      - name: Run local release-readiness verifier
        run: ./release/verify-release-readiness.sh

  artifacts:
    name: Release ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      COLOSSUS_RELEASE_JOURNAL_KEY: "5555555555555555555555555555555555555555555555555555555555555555"
      COLOSSUS_RELEASE_SIGNING_KEY: "6666666666666666666666666666666666666666666666666666666666666666"
      COLOSSUS_BUNDLE_JOURNAL_KEY: "9999999999999999999999999999999999999999999999999999999999999999"
      COLOSSUS_BUNDLE_CHECKPOINT_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      COLOSSUS_BUNDLE_SIGNING_SEED: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: ubuntu-latest-m
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - runner: windows-latest-l
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96 and release target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache release target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          key: release-${{ matrix.target }}
          cache-targets: false

      - name: Install Linux release and sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools file
          install_dir="/colossus-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          staged_binary="$install_dir/colossus"
          sudo install -d -o root -g root -m 0755 "$install_dir"
          sudo install -o root -g root -m 0755 /bin/true "$staged_binary"
          sudo release/install-apparmor.sh "$staged_binary"
          cargo build --locked -p colossus-cli --bin colossus
          sudo install -o root -g root -m 0755 \
            target/debug/colossus "$staged_binary"
          printf 'COLOSSUS_NATIVE_TEST_BINARY=%s\n' "$staged_binary" >> "$GITHUB_ENV"

      - name: Run Unix native sandbox acceptance
        if: runner.os != 'Windows'
        run: cargo test --locked -p colossus-cli --test native_sandbox -- --nocapture

      - name: Run Windows native runtime acceptance
        if: runner.os == 'Windows'
        run: cargo test --locked -p colossus-windows-native -- --nocapture

      - name: Run Windows worker and sandbox acceptance
        if: runner.os == 'Windows'
        run: >-
          cargo test --locked -p colossus-cli
          --test worker_smoke --test windows_sandbox -- --nocapture

      - name: Build locked release binary
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          --package colossus-cli --bin colossus

      - name: Prove static Linux linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file target/${{ matrix.target }}/release/colossus | tee binary-file.txt
          grep -Eq 'static(-pie)? linked|statically linked' binary-file.txt

      - name: Package and verify Unix release
        if: runner.os != 'Windows'
        run: ./scripts/ci/release-unix.sh "${{ matrix.target }}"

      - name: Package and verify Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/release-windows.ps1 -Target "${{ matrix.target }}"

      - name: Upload release archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colossus-${{ matrix.target }}
          path: dist/colossus-*-${{ matrix.target }}.${{ matrix.archive }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  bootstrap_installers:
    name: Package repository-owned bootstrap installers
    needs: validate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out repository bootstrap sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate bootstrap installer syntax
        shell: bash
        run: |
          set -euo pipefail
          sh -n release/bootstrap/install.sh release/install.sh
          shellcheck release/bootstrap/install.sh release/install.sh
          # The PowerShell program is intentionally literal to Bash.
          # shellcheck disable=SC2016
          pwsh -NoProfile -NonInteractive -Command '
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path "release/bootstrap/install.ps1"),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path "release/install.ps1"),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          '

      - name: Stage immutable bootstrap installer assets
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 dist
          install -m 0755 release/bootstrap/install.sh dist/colossus-install.sh
          install -m 0644 release/bootstrap/install.ps1 dist/colossus-install.ps1
          (
            cd dist
            sha256sum colossus-install.sh > colossus-install.sh.sha256
            sha256sum colossus-install.ps1 > colossus-install.ps1.sha256
          )

      - name: Upload bootstrap installers and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colossus-bootstrap-installers
          path: dist/colossus-install.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  sdk_release:
    name: Build immutable stable SDK candidate
    if: needs.validate.outputs.target_channel == 'stable'
    needs: validate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      SDK_BASE_TAG: ${{ needs.validate.outputs.sdk_base_tag }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    steps:
      - name: Check out complete SDK release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Node.js 22.18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            sdk/typescript/package-lock.json

      - name: Install the pinned npm packer
        run: npm install --global npm@11.5.1

      - name: Install Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.10.18

      - name: Install Go 1.25
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.25.0
          cache-dependency-path: sdk/go/go.sum

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0

      - name: Generate, test, and validate all SDK packages
        run: cargo xtask check sdk --base "$SDK_BASE_TAG"

      - name: Package the exact registry candidates
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          node scripts/ci/package-sdk-release.mjs \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_COMMIT" \
            --output dist/sdk-release
          node scripts/ci/verify-sdk-release.mjs \
            dist/sdk-release "$RELEASE_VERSION" "$SOURCE_COMMIT"

      - name: Upload the immutable SDK candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colossus-sdk-release
          path: dist/sdk-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  desktop_macos_build:
    name: Build unsigned Colossus Desktop aarch64-apple-darwin
    if: needs.validate.outputs.target_channel != 'stable'
    needs: validate
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      COLOSSUS_DESKTOP_TARGET: aarch64-apple-darwin
      SCCACHE_GHA_ENABLED: "true"
      COLOSSUS_DESKTOP_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      COLOSSUS_DESKTOP_RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
      COLOSSUS_DESKTOP_UPDATE_ENDPOINT: ""
      COLOSSUS_DESKTOP_UPDATE_PUBLIC_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 22.18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache the single desktop release target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> apps/desktop/src-tauri/target
          key: release-desktop-aarch64-apple-darwin
          cache-targets: false

      - name: Install locked desktop dependencies
        working-directory: apps/desktop
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Configure the non-production Desktop code identity
        run: echo 'COLOSSUS_DESKTOP_TEAM_ID=ADHOC' >> "$GITHUB_ENV"

      - name: Build the unsigned Desktop application without credentials
        run: ./scripts/package-desktop-macos build

      - name: Preserve the exact unsigned application archive
        shell: bash
        run: |
          set -euo pipefail
          source='apps/desktop/src-tauri/target/release/bundle/macos/Colossus Desktop.unsigned.zip'
          destination="$RUNNER_TEMP/desktop-unsigned"
          archive='Colossus-Desktop-unsigned-aarch64-apple-darwin.zip'
          test -f "$source"
          test ! -L "$source"
          install -d -m 0700 "$destination"
          install -m 0600 "$source" "$destination/$archive"
          printf '%s\n' "$COLOSSUS_DESKTOP_TEAM_ID" > "$destination/expected-team-id.txt"
          (cd "$destination" && shasum -a 256 "$archive" > "$archive.sha256")

      - name: Upload the exact unsigned application for isolated signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-unsigned-aarch64-apple-darwin
          path: ${{ runner.temp }}/desktop-unsigned/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  desktop_macos:
    name: Package Colossus Desktop aarch64-apple-darwin
    if: needs.validate.outputs.target_channel != 'stable'
    needs: [validate, desktop_macos_build]
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    env:
      COLOSSUS_DESKTOP_TARGET: aarch64-apple-darwin
      COLOSSUS_DESKTOP_RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
      COLOSSUS_DESKTOP_UPDATE_PUBLIC_KEY: ""
    steps:
      - name: Check out signing and verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 22.18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Download the exact unsigned application archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-macos-unsigned-aarch64-apple-darwin
          path: ${{ runner.temp }}/desktop-unsigned

      - name: Verify and extract the unsigned application with ditto
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/desktop-unsigned"
          archive='Colossus-Desktop-unsigned-aarch64-apple-darwin.zip'
          destination="$RUNNER_TEMP/desktop-sign"
          test -f "$artifact/$archive"
          test ! -L "$artifact/$archive"
          (cd "$artifact" && shasum -a 256 --check "$archive.sha256")

          repository=$(pwd -P)
          node_path=$(node -p 'require("node:fs").realpathSync(process.execPath)')
          protected_paths=(
            "$repository/scripts/package-desktop-macos"
            "$repository/scripts/write-desktop-bundle-manifest.mjs"
            "$repository/scripts/patch-desktop-manifest-binding.mjs"
            "$repository/scripts/verify-desktop-bundle.mjs"
            "$repository/scripts/verify-desktop-unsigned-archive.mjs"
            "$node_path"
          )
          protected_hashes=()
          for path in "${protected_paths[@]}"; do
            case "$path" in /*) ;; *) exit 1 ;; esac
            test -f "$path"
            test ! -L "$path"
            digest=$(/usr/bin/shasum -a 256 "$path")
            digest=${digest%% *}
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            protected_hashes+=("$digest")
          done

          node ./scripts/verify-desktop-unsigned-archive.mjs \
            --archive "$artifact/$archive"
          test ! -e "$destination"
          test ! -L "$destination"
          install -d -m 0700 "$destination"
          /usr/bin/ditto -x -k "$artifact/$archive" "$destination"

          for index in "${!protected_paths[@]}"; do
            digest=$(/usr/bin/shasum -a 256 "${protected_paths[$index]}")
            digest=${digest%% *}
            test "$digest" = "${protected_hashes[$index]}"
          done

          node ./scripts/verify-desktop-unsigned-archive.mjs \
            --archive "$artifact/$archive" \
            --extracted-root "$destination"
          app="$destination/Colossus Desktop.app"
          test -d "$app"
          test ! -L "$app"
          printf 'COLOSSUS_DESKTOP_UNSIGNED_APP=%s\n' "$app" >> "$GITHUB_ENV"

      - name: Configure Developer Preview or validation-only ad-hoc signing
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/desktop-unsigned/expected-team-id.txt")" = ADHOC
          {
            echo 'COLOSSUS_DESKTOP_SIGNING_IDENTITY=-'
            echo 'COLOSSUS_DESKTOP_TEAM_ID=ADHOC'
          } >> "$GITHUB_ENV"

      - name: Ad-hoc sign and verify the Developer Preview or validation bundle
        run: ./scripts/package-desktop-macos sign "$COLOSSUS_DESKTOP_UNSIGNED_APP"

      - name: Name desktop archive and checksum
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/desktop-sign/Colossus Desktop.zip"
          destination="$RUNNER_TEMP/desktop-release"
          case "$RELEASE_CHANNEL" in
            developer_preview)
              archive="Colossus-Desktop-DEVELOPER-PREVIEW-${RELEASE_TAG}-aarch64-apple-darwin.zip"
              ;;
            validation_only)
              archive="Colossus-Desktop-VALIDATION-ONLY-ADHOC-${RELEASE_TAG}-aarch64-apple-darwin.zip"
              ;;
            *)
              echo "unexpected release channel: $RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac
          test -f "$source"
          install -d -m 0700 "$destination"
          install -m 0644 "$source" "$destination/$archive"
          (cd "$destination" && shasum -a 256 "$archive" > "$archive.sha256")

      - name: Upload channel-labeled Desktop archive and checksum
        if: needs.validate.outputs.publish_draft == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colossus-desktop-aarch64-apple-darwin
          path: ${{ runner.temp }}/desktop-release/Colossus-Desktop-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload non-runnable ADHOC validation archive and checksum
        if: needs.validate.outputs.publish_draft != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colossus-desktop-validation-only-adhoc-aarch64-apple-darwin
          path: ${{ runner.temp }}/desktop-release/Colossus-Desktop-VALIDATION-ONLY-ADHOC-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  desktop_windows_preview:
    name: Package unsigned Windows Desktop Developer Preview
    if: needs.validate.outputs.target_channel != 'stable'
    needs: validate
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}\apps\desktop\src-tauri\target
      COLOSSUS_DESKTOP_RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
      COLOSSUS_DESKTOP_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      COLOSSUS_DESKTOP_TARGET: x86_64-pc-windows-msvc
      COLOSSUS_DESKTOP_TEAM_ID: UNSIGNED
      COLOSSUS_DESKTOP_UPDATE_ENDPOINT: ""
      COLOSSUS_DESKTOP_UPDATE_PUBLIC_KEY: ""
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 22.18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache the Windows Desktop target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> apps/desktop/src-tauri/target
          key: release-desktop-x86_64-pc-windows-msvc
          cache-targets: false

      - name: Install locked Desktop dependencies
        working-directory: apps/desktop
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Build sealed unsigned NSIS installer
        shell: pwsh
        run: ./scripts/package-desktop-windows.ps1

      - name: Install, launch preview, uninstall, and verify process cleanup
        id: smoke
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc\release\bundle\nsis"
          $installer = @(Get-ChildItem -LiteralPath $bundle -Filter "*.exe" -File)
          if ($installer.Count -ne 1) {
            throw "expected exactly one NSIS installer"
          }
          $install = Start-Process -FilePath $installer[0].FullName `
            -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "silent NSIS installation failed"
          }

          $installed = @(
            Get-ChildItem -LiteralPath $env:LOCALAPPDATA `
              -Filter "colossus-desktop.exe" -File -Recurse -ErrorAction SilentlyContinue
          )
          if ($installed.Count -ne 1) {
            throw "installation did not produce exactly one per-user Desktop executable"
          }
          $installRoot = $installed[0].Directory.FullName
          if (-not $installRoot.StartsWith($env:LOCALAPPDATA, [StringComparison]::OrdinalIgnoreCase)) {
            throw "installer escaped the per-user application root"
          }

          if ($env:RELEASE_CHANNEL -eq "developer_preview") {
            $application = Start-Process -FilePath $installed[0].FullName -PassThru
            Start-Sleep -Seconds 8
            if ($application.HasExited) {
              throw "Developer Preview exited during first-launch smoke testing"
            }
            Stop-Process -Id $application.Id -Force
            $application.WaitForExit()
          }

          $uninstallers = @(
            Get-ChildItem -LiteralPath $installRoot -Filter "*uninstall*.exe" `
              -File -ErrorAction SilentlyContinue
          )
          if ($uninstallers.Count -ne 1) {
            throw "installation did not expose exactly one uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstallers[0].FullName `
            -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "silent NSIS uninstall failed"
          }
          Start-Sleep -Seconds 2
          if (Test-Path -LiteralPath $installed[0].FullName) {
            throw "Desktop executable remained after uninstall"
          }
          if (@(Get-Process -Name "colossus-desktop", "colossus-sidecar", "colossus" `
                -ErrorAction SilentlyContinue).Count -ne 0) {
            throw "Colossus processes remained after uninstall"
          }
          "install_uninstall=passed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($env:RELEASE_CHANNEL -eq "developer_preview") {
            "first_launch=passed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "first_launch=not_runnable_validation_bundle" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Name installer, checksum, manifest, and provenance
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SMOKE_FIRST_LAUNCH: ${{ steps.smoke.outputs.first_launch }}
          SMOKE_INSTALL_UNINSTALL: ${{ steps.smoke.outputs.install_uninstall }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc\release\bundle\nsis"
          $source = @(Get-ChildItem -LiteralPath $bundle -Filter "*.exe" -File)
          if ($source.Count -ne 1) {
            throw "expected exactly one verified NSIS installer"
          }
          $destination = Join-Path $env:RUNNER_TEMP "desktop-windows-release"
          New-Item -ItemType Directory -Path $destination | Out-Null
          $label = if ($env:RELEASE_CHANNEL -eq "developer_preview") {
            "DEVELOPER-PREVIEW"
          } else {
            "VALIDATION-ONLY"
          }
          $name = "Colossus-Desktop-UNSIGNED-$label-$env:RELEASE_TAG-x86_64-pc-windows-msvc-setup.exe"
          $installer = Join-Path $destination $name
          Copy-Item -LiteralPath $source[0].FullName -Destination $installer
          $signatureSource = "$($source[0].FullName).sig"
          if (Test-Path -LiteralPath $signatureSource) {
            throw "unsigned Windows packaging unexpectedly produced an updater signature"
          }
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $name" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

          $manifestSource = Join-Path $env:CARGO_TARGET_DIR `
            "x86_64-pc-windows-msvc\release\colossus-bundle-manifest.json"
          if (-not (Test-Path -LiteralPath $manifestSource -PathType Leaf)) {
            $manifestSource = Join-Path $env:GITHUB_WORKSPACE `
              "apps\desktop\src-tauri\binaries\colossus-bundle-manifest.json"
          }
          if (-not (Test-Path -LiteralPath $manifestSource -PathType Leaf)) {
            throw "sealed bundle manifest was not retained for provenance"
          }
          Copy-Item -LiteralPath $manifestSource `
            -Destination (Join-Path $destination "Colossus-Desktop-$env:RELEASE_TAG-windows-bundle-manifest.json")

          $provenance = [ordered]@{
            schemaVersion = 1
            sourceCommit = $env:GITHUB_SHA
            releaseTag = $env:RELEASE_TAG
            releaseChannel = $env:RELEASE_CHANNEL
            platform = "windows"
            architecture = "x86_64"
            installer = $name
            installerSha256 = $digest
            codeSigning = "unsigned_developer_preview"
            smartScreenWarningExpected = $true
            bundleIntegrity = "sealed_manifest"
            updateSignature = if ($env:RELEASE_CHANNEL -eq "developer_preview") {
              "disabled_unsigned_preview"
            } else {
              "disabled_validation_only"
            }
            installUninstallSmoke = $env:SMOKE_INSTALL_UNINSTALL
            firstLaunchSmoke = $env:SMOKE_FIRST_LAUNCH
          }
          $provenance | ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $destination `
              "Colossus-Desktop-$env:RELEASE_TAG-windows-provenance.json") -Encoding utf8

      - name: Upload unsigned Windows Developer Preview
        if: needs.validate.outputs.publish_draft == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colossus-desktop-windows-x86_64-preview
          path: ${{ runner.temp }}\desktop-windows-release\*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload unsigned Windows validation package
        if: needs.validate.outputs.publish_draft != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colossus-desktop-windows-x86_64-validation-only
          path: ${{ runner.temp }}\desktop-windows-release\*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  gate:
    name: Colossus release gate
    if: always()
    needs:
      [
        validate,
        artifacts,
        bootstrap_installers,
        sdk_release,
        desktop_macos_build,
        desktop_macos,
        desktop_windows_preview,
      ]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check out gate contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the complete core or Developer Preview release
        shell: bash
        env:
          TARGET_CHANNEL: ${{ needs.validate.outputs.target_channel }}
          SDK_RELEASE_RESULT: ${{ needs.sdk_release.result }}
          MACOS_DESKTOP_BUILD_RESULT: ${{ needs.desktop_macos_build.result }}
          MACOS_DESKTOP_RESULT: ${{ needs.desktop_macos.result }}
          WINDOWS_DESKTOP_RESULT: ${{ needs.desktop_windows_preview.result }}
        run: |
          set -euo pipefail
          ./scripts/ci/require-success.sh \
            validate=${{ needs.validate.result }} \
            artifacts=${{ needs.artifacts.result }} \
            bootstrap_installers=${{ needs.bootstrap_installers.result }}
          if [ "$TARGET_CHANNEL" = stable ]; then
            ./scripts/ci/require-success.sh sdk_release="$SDK_RELEASE_RESULT"
            test "$MACOS_DESKTOP_BUILD_RESULT" = skipped
            test "$MACOS_DESKTOP_RESULT" = skipped
            test "$WINDOWS_DESKTOP_RESULT" = skipped
          else
            test "$SDK_RELEASE_RESULT" = skipped
            ./scripts/ci/require-success.sh \
              desktop_macos_build="$MACOS_DESKTOP_BUILD_RESULT" \
              desktop_macos="$MACOS_DESKTOP_RESULT" \
              desktop_windows_preview="$WINDOWS_DESKTOP_RESULT"
          fi

  draft-release:
    name: Create draft GitHub Release
    if: ${{ !cancelled() && needs.validate.outputs.publish_draft == 'true' && needs.gate.result == 'success' }}
    needs: [validate, gate]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: colossus-*
          path: dist
          merge-multiple: true

      - name: Verify complete release asset set
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          case "$RELEASE_CHANNEL" in
            stable)
              test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 21
              sdk_dir="$RUNNER_TEMP/sdk-release"
              install -d -m 0700 "$sdk_dir"
              for sdk_asset in \
                "dist/obscuritylabs-colossus-sdk-${RELEASE_VERSION}.tgz" \
                "dist/obscuritylabs_colossus_sdk-${RELEASE_VERSION}-py3-none-any.whl" \
                "dist/obscuritylabs_colossus_sdk-${RELEASE_VERSION}.tar.gz" \
                "dist/colossus-sdk-${RELEASE_TAG}-manifest.json" \
                "dist/colossus-sdk-${RELEASE_TAG}-SHA256SUMS"; do
                test -f "$sdk_asset"
                install -m 0600 "$sdk_asset" "$sdk_dir/$(basename "$sdk_asset")"
              done
              node scripts/ci/verify-sdk-release.mjs \
                "$sdk_dir" "$RELEASE_VERSION" "$SOURCE_COMMIT"
              ;;
            developer_preview)
              test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 22
              desktop="Colossus-Desktop-DEVELOPER-PREVIEW-${RELEASE_TAG}-aarch64-apple-darwin.zip"
              windows="Colossus-Desktop-UNSIGNED-DEVELOPER-PREVIEW-${RELEASE_TAG}-x86_64-pc-windows-msvc-setup.exe"
              test -f "dist/$windows"
              test -f "dist/$windows.sha256"
              test -f "dist/Colossus-Desktop-${RELEASE_TAG}-windows-bundle-manifest.json"
              test -f "dist/Colossus-Desktop-${RELEASE_TAG}-windows-provenance.json"
              test ! -e "dist/developer_preview.json"
              test -f "dist/$desktop"
              test -f "dist/$desktop.sha256"
              ;;
            *)
              echo "refusing to publish release channel: $RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac
          for bootstrap_asset in \
            colossus-install.sh \
            colossus-install.sh.sha256 \
            colossus-install.ps1 \
            colossus-install.ps1.sha256; do
            test -f "dist/$bootstrap_asset"
          done
          for checksum in dist/*.sha256; do
            (cd dist && sha256sum --check --strict "$(basename "$checksum")")
          done

      - name: Create or update human-approved draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          existing=$RUNNER_TEMP/existing-release.json
          api_error=$RUNNER_TEMP/existing-release.error
          case "$RELEASE_CHANNEL" in
            stable)
              test "$RELEASE_PRERELEASE" = false
              release_title="Colossus $RELEASE_TAG"
              ;;
            developer_preview)
              test "$RELEASE_PRERELEASE" = true
              release_title="Colossus $RELEASE_TAG - Developer Preview (Unnotarized)"
              ;;
            *)
              echo "refusing to create release for channel: $RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            >"$existing" 2>"$api_error"; then
            jq -e \
              --argjson prerelease "$RELEASE_PRERELEASE" \
              '.draft == true and .prerelease == $prerelease' \
              "$existing" >/dev/null || {
              echo "refusing to modify a published release or change its release kind" >&2
              exit 1
            }
            if [ "$RELEASE_CHANNEL" = developer_preview ]; then
              jq -e \
                --arg title "$release_title" \
                '.name == $title and (.body | contains("Developer Preview") and contains("not notarized"))' \
                "$existing" >/dev/null || {
                echo "refusing to modify a Developer Preview without its warning" >&2
                exit 1
              }
            fi
            while IFS= read -r existing_asset; do
              test -f "dist/$existing_asset" || {
                echo "refusing to retain unexpected draft asset: $existing_asset" >&2
                exit 1
              }
            done < <(jq -r '.assets[].name' "$existing")
            gh release upload "$RELEASE_TAG" dist/* --clobber
          elif grep -F '(HTTP 404)' "$api_error" >/dev/null; then
            if [ "$RELEASE_CHANNEL" = developer_preview ]; then
              preview_checksum="Colossus-Desktop-DEVELOPER-PREVIEW-${RELEASE_TAG}-aarch64-apple-darwin.zip.sha256"
              # Markdown code spans are intentionally literal in the release notes.
              # shellcheck disable=SC2016
              checksum_note=$(printf '%s `%s`.' \
                'Keep the archive and its `.sha256` file together, then verify it with' \
                "shasum -a 256 --check $preview_checksum")
              # shellcheck disable=SC2016
              preview_notes=$(printf '%s\n' \
                '> [!WARNING]' \
                '> **Developer Preview:** This entire release is pre-release software for testing. The macOS Desktop build is ad-hoc signed and not notarized by Apple. The Windows Desktop installer is unsigned and Microsoft Defender SmartScreen is expected to warn. Do not treat either Desktop build as stable or production-ready.' \
                '' \
                'Desktop package names include `DEVELOPER-PREVIEW`; the Windows installer additionally includes `UNSIGNED`.' \
                'Automatic Desktop updates are disabled in this unsigned preview. Install later previews manually from GitHub Releases.' \
                "$checksum_note" \
                '' \
                'For first launch, extract the archive, Control-click **Colossus Desktop**, choose **Open**, then confirm **Open**. If macOS still blocks it, use **System Settings > Privacy & Security > Open Anyway**. Do not disable Gatekeeper globally.')
              gh release create "$RELEASE_TAG" dist/* \
                --draft --prerelease --verify-tag --generate-notes \
                --notes "$preview_notes" \
                --title "$release_title"
            else
              gh release create "$RELEASE_TAG" dist/* \
                --draft --verify-tag --generate-notes \
                --title "$release_title"
            fi
          else
            cat "$api_error" >&2
            exit 1
          fi
