name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate without publishing, for example v0.10.0 or v0.10.1-preview.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
      publish_draft: ${{ steps.request.outputs.publish_draft }}
      release_channel: ${{ steps.request.outputs.release_channel }}
      prerelease: ${{ steps.request.outputs.prerelease }}
    steps:
      - name: Check out complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          key: release-readiness
          cache-targets: false

      - name: Install checksum-verified release tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
          fallback: none

      - name: Validate tag, version, changelog, and ancestry
        id: request
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            tag=$REF_NAME
            test "$(git cat-file -t "$tag")" = tag
            git fetch origin main
            tag_commit=$(git rev-list -n 1 "$tag")
            git merge-base --is-ancestor "$tag_commit" origin/main
            publish_draft=true
          else
            tag=$DISPATCH_VERSION
            publish_draft=false
          fi
          if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            tag_channel=stable
            prerelease=false
          elif [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.([1-9][0-9]*)$ ]]; then
            tag_channel=developer_preview
            prerelease=true
          else
            echo 'release tag must be vX.Y.Z or vX.Y.Z-preview.N with N greater than zero' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = push ]; then
            release_channel=$tag_channel
          else
            release_channel=validation_only
            prerelease=false
          fi
          version=${tag#v}
          workspace_version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "colossus-cli") | .version')
          test "$version" = "$workspace_version"
          grep -F "## [$version]" CHANGELOG.md >/dev/null
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'publish_draft=%s\n' "$publish_draft"
            printf 'release_channel=%s\n' "$release_channel"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare exact-path AppArmor profile for readiness tests
        run: |
          cargo build --locked -p colossus-cli --bin colossus
          sudo install -d -o root -g root -m 0755 /usr/local/libexec/colossus-ci
          sudo install -o root -g root -m 0755 \
            target/debug/colossus /usr/local/libexec/colossus-ci/colossus
          sudo release/install-apparmor.sh /usr/local/libexec/colossus-ci/colossus
          echo 'COLOSSUS_NATIVE_TEST_BINARY=/usr/local/libexec/colossus-ci/colossus' >> "$GITHUB_ENV"

      - name: Run local release-readiness verifier
        run: ./release/verify-release-readiness.sh

  artifacts:
    name: Release ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      COLOSSUS_RELEASE_JOURNAL_KEY: "5555555555555555555555555555555555555555555555555555555555555555"
      COLOSSUS_RELEASE_SIGNING_KEY: "6666666666666666666666666666666666666666666666666666666666666666"
      COLOSSUS_BUNDLE_JOURNAL_KEY: "9999999999999999999999999999999999999999999999999999999999999999"
      COLOSSUS_BUNDLE_CHECKPOINT_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      COLOSSUS_BUNDLE_SIGNING_SEED: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96 and release target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache release target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          key: release-${{ matrix.target }}
          cache-targets: false

      - name: Install Linux release and sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools file
          cargo build --locked -p colossus-cli --bin colossus
          sudo install -d -o root -g root -m 0755 /usr/local/libexec/colossus-ci
          sudo install -o root -g root -m 0755 \
            target/debug/colossus /usr/local/libexec/colossus-ci/colossus
          sudo release/install-apparmor.sh /usr/local/libexec/colossus-ci/colossus
          echo 'COLOSSUS_NATIVE_TEST_BINARY=/usr/local/libexec/colossus-ci/colossus' >> "$GITHUB_ENV"

      - name: Run Unix native sandbox acceptance
        if: runner.os != 'Windows'
        run: cargo test --locked -p colossus-cli --test native_sandbox -- --nocapture

      - name: Run Windows runtime and sandbox acceptance
        if: runner.os == 'Windows'
        run: >-
          cargo test --locked -p colossus-cli
          --test worker_smoke --test windows_sandbox -- --nocapture

      - name: Build locked release binary
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          --package colossus-cli --bin colossus

      - name: Prove static Linux linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file target/${{ matrix.target }}/release/colossus | tee binary-file.txt
          grep -Eq 'static(-pie)? linked|statically linked' binary-file.txt

      - name: Package and verify Unix release
        if: runner.os != 'Windows'
        run: ./scripts/ci/release-unix.sh "${{ matrix.target }}"

      - name: Package and verify Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/release-windows.ps1 -Target "${{ matrix.target }}"

      - name: Upload release archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colossus-${{ matrix.target }}
          path: dist/colossus-*-${{ matrix.target }}.${{ matrix.archive }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  desktop_macos_build:
    name: Build unsigned Colossus Desktop aarch64-apple-darwin
    needs: validate
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      COLOSSUS_DESKTOP_TARGET: aarch64-apple-darwin
      SCCACHE_GHA_ENABLED: "true"
      COLOSSUS_DESKTOP_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      COLOSSUS_DESKTOP_RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 22.18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache the single desktop release target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> apps/desktop/src-tauri/target
          key: release-desktop-aarch64-apple-darwin
          cache-targets: false

      - name: Install locked desktop dependencies
        working-directory: apps/desktop
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Configure Developer Preview or validation-only code identity
        if: needs.validate.outputs.release_channel != 'stable'
        run: echo 'COLOSSUS_DESKTOP_TEAM_ID=ADHOC' >> "$GITHUB_ENV"

      - name: Configure the public release code identity
        if: needs.validate.outputs.release_channel == 'stable'
        shell: bash
        env:
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if ! [[ "$MACOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            printf '%s\n' \
              'MACOS_TEAM_ID repository variable must be a 10-character Apple Team ID' >&2
            exit 1
          fi
          printf 'COLOSSUS_DESKTOP_TEAM_ID=%s\n' "$MACOS_TEAM_ID" >> "$GITHUB_ENV"

      - name: Build the unsigned Desktop application without credentials
        run: ./scripts/package-desktop-macos build

      - name: Preserve the exact unsigned application archive
        shell: bash
        run: |
          set -euo pipefail
          source='apps/desktop/src-tauri/target/release/bundle/macos/Colossus Desktop.unsigned.zip'
          destination="$RUNNER_TEMP/desktop-unsigned"
          archive='Colossus-Desktop-unsigned-aarch64-apple-darwin.zip'
          test -f "$source"
          test ! -L "$source"
          install -d -m 0700 "$destination"
          install -m 0600 "$source" "$destination/$archive"
          printf '%s\n' "$COLOSSUS_DESKTOP_TEAM_ID" > "$destination/expected-team-id.txt"
          (cd "$destination" && shasum -a 256 "$archive" > "$archive.sha256")

      - name: Upload the exact unsigned application for isolated signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-unsigned-aarch64-apple-darwin
          path: ${{ runner.temp }}/desktop-unsigned/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  desktop_macos:
    name: Package Colossus Desktop aarch64-apple-darwin
    needs: [validate, desktop_macos_build]
    runs-on: macos-14
    timeout-minutes: 45
    env:
      COLOSSUS_DESKTOP_TARGET: aarch64-apple-darwin
      COLOSSUS_DESKTOP_RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
    steps:
      - name: Check out signing and verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the exact unsigned application archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-macos-unsigned-aarch64-apple-darwin
          path: ${{ runner.temp }}/desktop-unsigned

      - name: Verify and extract the unsigned application with ditto
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/desktop-unsigned"
          archive='Colossus-Desktop-unsigned-aarch64-apple-darwin.zip'
          destination="$RUNNER_TEMP/desktop-sign"
          test -f "$artifact/$archive"
          test ! -L "$artifact/$archive"
          (cd "$artifact" && shasum -a 256 --check "$archive.sha256")

          repository=$(pwd -P)
          node_path=$(node -p 'require("node:fs").realpathSync(process.execPath)')
          protected_paths=(
            "$repository/scripts/package-desktop-macos"
            "$repository/scripts/write-desktop-bundle-manifest.mjs"
            "$repository/scripts/patch-desktop-manifest-binding.mjs"
            "$repository/scripts/verify-desktop-bundle.mjs"
            "$repository/scripts/verify-desktop-unsigned-archive.mjs"
            "$node_path"
          )
          protected_hashes=()
          for path in "${protected_paths[@]}"; do
            case "$path" in /*) ;; *) exit 1 ;; esac
            test -f "$path"
            test ! -L "$path"
            digest=$(/usr/bin/shasum -a 256 "$path")
            digest=${digest%% *}
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            protected_hashes+=("$digest")
          done

          node ./scripts/verify-desktop-unsigned-archive.mjs \
            --archive "$artifact/$archive"
          test ! -e "$destination"
          test ! -L "$destination"
          install -d -m 0700 "$destination"
          /usr/bin/ditto -x -k "$artifact/$archive" "$destination"

          for index in "${!protected_paths[@]}"; do
            digest=$(/usr/bin/shasum -a 256 "${protected_paths[$index]}")
            digest=${digest%% *}
            test "$digest" = "${protected_hashes[$index]}"
          done

          node ./scripts/verify-desktop-unsigned-archive.mjs \
            --archive "$artifact/$archive" \
            --extracted-root "$destination"
          app="$destination/Colossus Desktop.app"
          test -d "$app"
          test ! -L "$app"
          printf 'COLOSSUS_DESKTOP_UNSIGNED_APP=%s\n' "$app" >> "$GITHUB_ENV"

      - name: Configure Developer Preview or validation-only ad-hoc signing
        if: needs.validate.outputs.release_channel != 'stable'
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/desktop-unsigned/expected-team-id.txt")" = ADHOC
          {
            echo 'COLOSSUS_DESKTOP_SIGNING_IDENTITY=-'
            echo 'COLOSSUS_DESKTOP_TEAM_ID=ADHOC'
          } >> "$GITHUB_ENV"

      - name: Import Developer ID and notarization credentials
        if: needs.validate.outputs.release_channel == 'stable'
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEVELOPER_ID_P12_BASE64"
          test -n "$DEVELOPER_ID_P12_PASSWORD"
          test -n "$NOTARY_API_KEY_BASE64"
          test -n "$NOTARY_ISSUER_ID"
          test -n "$NOTARY_KEY_ID"
          if ! [[ "$MACOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            printf '%s\n' \
              'MACOS_TEAM_ID secret must be a 10-character Apple Team ID' >&2
            exit 1
          fi
          test "$(cat "$RUNNER_TEMP/desktop-unsigned/expected-team-id.txt")" = "$MACOS_TEAM_ID"

          keychain="$RUNNER_TEMP/colossus-desktop-signing.keychain-db"
          p12="$RUNNER_TEMP/colossus-developer-id.p12"
          notary_key="$RUNNER_TEMP/colossus-notary-api-key.p8"
          profile="colossus-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keychain_password=$(openssl rand -hex 32)

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$p12"
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$notary_key"
          chmod 0600 "$p12" "$notary_key"
          test -s "$p12"
          test -s "$notary_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          identity_record=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application:/ { count += 1; value = $0 } END { if (count == 1) print value }')
          test -n "$identity_record"
          printf '%s\n' "$identity_record" | grep -F "($MACOS_TEAM_ID)" >/dev/null
          identity=$(printf '%s\n' "$identity_record" | awk '{ print $2 }')
          [[ "$identity" =~ ^[0-9A-Fa-f]{40}$ ]]
          xcrun notarytool store-credentials "$profile" \
            --key "$notary_key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$keychain" \
            --validate

          {
            printf 'COLOSSUS_DESKTOP_SIGNING_IDENTITY=%s\n' "$identity"
            printf 'COLOSSUS_DESKTOP_NOTARY_PROFILE=%s\n' "$profile"
            printf 'COLOSSUS_DESKTOP_NOTARY_KEYCHAIN=%s\n' "$keychain"
            printf 'COLOSSUS_DESKTOP_TEAM_ID=%s\n' "$MACOS_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Sign, verify, notarize, and staple the stable release
        if: needs.validate.outputs.release_channel == 'stable'
        run: ./scripts/package-desktop-macos sign "$COLOSSUS_DESKTOP_UNSIGNED_APP"

      - name: Ad-hoc sign and verify the Developer Preview or validation bundle
        if: needs.validate.outputs.release_channel != 'stable'
        run: ./scripts/package-desktop-macos sign "$COLOSSUS_DESKTOP_UNSIGNED_APP"

      - name: Name desktop archive and checksum
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/desktop-sign/Colossus Desktop.zip"
          destination="$RUNNER_TEMP/desktop-release"
          case "$RELEASE_CHANNEL" in
            stable)
              archive="Colossus-Desktop-${RELEASE_TAG}-aarch64-apple-darwin.zip"
              ;;
            developer_preview)
              archive="Colossus-Desktop-DEVELOPER-PREVIEW-${RELEASE_TAG}-aarch64-apple-darwin.zip"
              ;;
            validation_only)
              archive="Colossus-Desktop-VALIDATION-ONLY-ADHOC-${RELEASE_TAG}-aarch64-apple-darwin.zip"
              ;;
            *)
              echo "unexpected release channel: $RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac
          test -f "$source"
          install -d -m 0700 "$destination"
          install -m 0644 "$source" "$destination/$archive"
          (cd "$destination" && shasum -a 256 "$archive" > "$archive.sha256")

      - name: Upload channel-labeled Desktop archive and checksum
        if: needs.validate.outputs.publish_draft == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colossus-desktop-aarch64-apple-darwin
          path: ${{ runner.temp }}/desktop-release/Colossus-Desktop-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload non-runnable ADHOC validation archive and checksum
        if: needs.validate.outputs.publish_draft != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colossus-desktop-validation-only-adhoc-aarch64-apple-darwin
          path: ${{ runner.temp }}/desktop-release/Colossus-Desktop-VALIDATION-ONLY-ADHOC-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove ephemeral signing material
        if: always() && needs.validate.outputs.release_channel == 'stable'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/colossus-desktop-signing.keychain-db" || true
          rm -f \
            "$RUNNER_TEMP/colossus-developer-id.p12" \
            "$RUNNER_TEMP/colossus-notary-api-key.p8"

  gate:
    name: Colossus release gate
    if: always()
    needs: [validate, artifacts, desktop_macos_build, desktop_macos]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out gate contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require release readiness, all six CLI targets, and Desktop
        run: >-
          ./scripts/ci/require-success.sh
          validate=${{ needs.validate.result }}
          artifacts=${{ needs.artifacts.result }}
          desktop_macos_build=${{ needs.desktop_macos_build.result }}
          desktop_macos=${{ needs.desktop_macos.result }}

  draft-release:
    name: Create draft GitHub Release
    if: needs.validate.outputs.publish_draft == 'true' && needs.gate.result == 'success'
    needs: [validate, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: colossus-*
          path: dist
          merge-multiple: true

      - name: Verify complete release asset set
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 14
          case "$RELEASE_CHANNEL" in
            stable)
              desktop="Colossus-Desktop-${RELEASE_TAG}-aarch64-apple-darwin.zip"
              ;;
            developer_preview)
              desktop="Colossus-Desktop-DEVELOPER-PREVIEW-${RELEASE_TAG}-aarch64-apple-darwin.zip"
              ;;
            *)
              echo "refusing to publish release channel: $RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac
          test -f "dist/$desktop"
          test -f "dist/$desktop.sha256"
          for checksum in dist/*.sha256; do
            (cd dist && sha256sum --check --strict "$(basename "$checksum")")
          done

      - name: Create or update human-approved draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          existing=$RUNNER_TEMP/existing-release.json
          api_error=$RUNNER_TEMP/existing-release.error
          case "$RELEASE_CHANNEL" in
            stable)
              test "$RELEASE_PRERELEASE" = false
              release_title="Colossus $RELEASE_TAG"
              ;;
            developer_preview)
              test "$RELEASE_PRERELEASE" = true
              release_title="Colossus $RELEASE_TAG - Developer Preview (Unnotarized)"
              ;;
            *)
              echo "refusing to create release for channel: $RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            >"$existing" 2>"$api_error"; then
            jq -e \
              --argjson prerelease "$RELEASE_PRERELEASE" \
              '.draft == true and .prerelease == $prerelease' \
              "$existing" >/dev/null || {
              echo "refusing to modify a published release or change its release kind" >&2
              exit 1
            }
            if [ "$RELEASE_CHANNEL" = developer_preview ]; then
              jq -e \
                --arg title "$release_title" \
                '.name == $title and (.body | contains("Developer Preview") and contains("not notarized"))' \
                "$existing" >/dev/null || {
                echo "refusing to modify a Developer Preview without its warning" >&2
                exit 1
              }
            fi
            while IFS= read -r existing_asset; do
              test -f "dist/$existing_asset" || {
                echo "refusing to retain unexpected draft asset: $existing_asset" >&2
                exit 1
              }
            done < <(jq -r '.assets[].name' "$existing")
            gh release upload "$RELEASE_TAG" dist/* --clobber
          elif grep -F '(HTTP 404)' "$api_error" >/dev/null; then
            if [ "$RELEASE_CHANNEL" = developer_preview ]; then
              preview_checksum="Colossus-Desktop-DEVELOPER-PREVIEW-${RELEASE_TAG}-aarch64-apple-darwin.zip.sha256"
              # Markdown code spans are intentionally literal in the release notes.
              # shellcheck disable=SC2016
              checksum_note=$(printf '%s `%s`.' \
                'Keep the archive and its `.sha256` file together, then verify it with' \
                "shasum -a 256 --check $preview_checksum")
              # shellcheck disable=SC2016
              preview_notes=$(printf '%s\n' \
                '> [!WARNING]' \
                '> **Developer Preview (Unnotarized):** This entire release is pre-release software for testing. The macOS Desktop build is ad-hoc signed and not notarized by Apple. macOS will require an explicit user-approved Gatekeeper override. Do not treat it as a stable or production release.' \
                '' \
                'The archive name includes `DEVELOPER-PREVIEW`.' \
                "$checksum_note" \
                '' \
                'For first launch, extract the archive, Control-click **Colossus Desktop**, choose **Open**, then confirm **Open**. If macOS still blocks it, use **System Settings > Privacy & Security > Open Anyway**. Do not disable Gatekeeper globally.')
              gh release create "$RELEASE_TAG" dist/* \
                --draft --prerelease --verify-tag --generate-notes \
                --notes "$preview_notes" \
                --title "$release_title"
            else
              gh release create "$RELEASE_TAG" dist/* \
                --draft --verify-tag --generate-notes \
                --title "$release_title"
            fi
          else
            cat "$api_error" >&2
            exit 1
          fi
