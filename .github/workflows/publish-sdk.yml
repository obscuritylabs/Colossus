name: Publish SDKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub Release tag to validate or recover
        required: true
        type: string
      publish:
        description: Publish missing registry artifacts and the Go module tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-sdk-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the published SDK candidate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      authorize_publish: ${{ steps.release.outputs.authorize_publish }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      sdk_base_tag: ${{ steps.release.outputs.sdk_base_tag }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the exact stable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Validate stable release identity and authority
        id: release
        shell: bash
        env:
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "SDK publication requires a stable vX.Y.Z release tag" >&2
            exit 1
          fi
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          source_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          test "$(git rev-parse HEAD)" = "$source_commit"
          git fetch origin main
          git merge-base --is-ancestor "$source_commit" origin/main
          source_date_epoch=$(git show -s --format=%ct "$source_commit")
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]
          sdk_base_tag=$(
            while IFS= read -r candidate; do
              if [ "$candidate" != "$RELEASE_TAG" ] &&
                [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                printf '%s\n' "$candidate"
              fi
            done < <(git tag --merged "$source_commit" --format='%(refname:short)') |
              sort -V |
              tail -n 1
          )
          test -n "$sdk_base_tag"
          git merge-base --is-ancestor \
            "$(git rev-list -n 1 "$sdk_base_tag")" "$source_commit"
          version=${RELEASE_TAG#v}
          workspace_version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "colossus-cli") | .version')
          test "$version" = "$workspace_version"
          if [ "$EVENT_NAME" = release ]; then
            test "$RELEASE_DRAFT" = false
            test "$RELEASE_PRERELEASE" = false
            authorize_publish=true
          else
            authorize_publish=$DISPATCH_PUBLISH
          fi
          {
            printf 'authorize_publish=%s\n' "$authorize_publish"
            printf 'source_commit=%s\n' "$source_commit"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
            printf 'sdk_base_tag=%s\n' "$sdk_base_tag"
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Download only the SDK assets from the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          install -d -m 0700 dist/sdk-release
          gh release download "$RELEASE_TAG" \
            --pattern 'obscuritylabs-colossus-sdk-*.tgz' \
            --pattern 'obscuritylabs_colossus_sdk-*.whl' \
            --pattern 'obscuritylabs_colossus_sdk-*.tar.gz' \
            --pattern 'colossus-sdk-v*-manifest.json' \
            --pattern 'colossus-sdk-v*-SHA256SUMS' \
            --dir dist/sdk-release

      - name: Verify package metadata, checksums, and source commit
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: >-
          node scripts/ci/verify-sdk-release.mjs
          dist/sdk-release "$RELEASE_VERSION" "$SOURCE_COMMIT"

      - name: Preserve the verified candidate for protected publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-sdk-release
          path: dist/sdk-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish missing SDK artifacts
    if: needs.validate.outputs.authorize_publish == 'true'
    needs: validate
    runs-on: ubuntu-latest-m
    timeout-minutes: 45
    environment: sdk-production
    env:
      SDK_BASE_TAG: ${{ needs.validate.outputs.sdk_base_tag }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the exact stable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Node.js 22.18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org

      - name: Install the pinned trusted-publishing-capable npm packer
        run: npm install --global npm@11.5.1

      - name: Install Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.10.18

      - name: Install Go 1.25
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.25.0
          cache-dependency-path: sdk/go/go.sum

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0

      - name: Download the verified SDK candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-sdk-release
          path: dist/sdk-release

      - name: Reverify the protected publication inputs
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          node scripts/ci/verify-sdk-release.mjs \
            dist/sdk-release "$RELEASE_VERSION" "$SOURCE_COMMIT"
          # The JavaScript template expression is intentionally literal to the shell.
          # shellcheck disable=SC2016
          node -e '
            const { execFileSync } = require("node:child_process");
            const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
            const [major, minor, patch] = version.split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error(`npm 11.5.1 or newer is required; found ${version}`);
            }
          '

      - name: Rebuild the SDK candidate from the exact release tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          cargo xtask check sdk --base "$SDK_BASE_TAG"
          node scripts/ci/package-sdk-release.mjs \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_COMMIT" \
            --output dist/sdk-rebuilt
          node scripts/ci/verify-sdk-release.mjs \
            dist/sdk-rebuilt "$RELEASE_VERSION" "$SOURCE_COMMIT"
          node scripts/ci/verify-sdk-release.mjs \
            dist/sdk-release "$RELEASE_VERSION" "$SOURCE_COMMIT" dist/sdk-rebuilt

      - name: Reconcile the npm release
        id: npm_state
        env:
          SDK_MANIFEST: colossus-sdk-${{ needs.validate.outputs.tag }}-manifest.json
        run: node scripts/ci/check-sdk-registry-state.mjs npm dist/sdk-release

      - name: Publish the exact npm tarball with trusted publishing
        if: steps.npm_state.outputs.publish == 'true'
        env:
          NPM_CONFIG_PROVENANCE: "false"
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          npm publish
          "dist/sdk-release/obscuritylabs-colossus-sdk-${RELEASE_VERSION}.tgz"
          --access public --provenance=false

      - name: Reconcile the PyPI release
        id: pypi_state
        env:
          SDK_MANIFEST: colossus-sdk-${{ needs.validate.outputs.tag }}-manifest.json
        run: node scripts/ci/check-sdk-registry-state.mjs pypi dist/sdk-release

      - name: Stage only the exact Python distributions
        if: steps.pypi_state.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          install -d -m 0700 pypi-dist
          install -m 0600 \
            "dist/sdk-release/obscuritylabs_colossus_sdk-${RELEASE_VERSION}-py3-none-any.whl" \
            "dist/sdk-release/obscuritylabs_colossus_sdk-${RELEASE_VERSION}.tar.gz" \
            pypi-dist/

      - name: Publish missing Python distributions with trusted publishing
        if: steps.pypi_state.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 2026-08-02
        with:
          packages-dir: pypi-dist/
          skip-existing: true

      - name: Create or verify the Go module tag
        shell: bash
        env:
          GO_TAG: sdk/go/${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          set +e
          remote=$(git ls-remote --exit-code --tags origin \
            "refs/tags/$GO_TAG" "refs/tags/$GO_TAG^{}")
          status=$?
          set -e
          case "$status" in
            0)
              git fetch --force origin "refs/tags/$GO_TAG:refs/tags/$GO_TAG"
              test "$(git rev-list -n 1 "$GO_TAG")" = "$SOURCE_COMMIT"
              ;;
            2)
              git config user.name github-actions
              git config user.email github-actions@github.com
              git tag -a "$GO_TAG" "$SOURCE_COMMIT" \
                -m "Colossus Go SDK $GO_TAG"
              git push origin "refs/tags/$GO_TAG"
              ;;
            *)
              printf '%s\n' "$remote" >&2
              exit "$status"
              ;;
          esac
