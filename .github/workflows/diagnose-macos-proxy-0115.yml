name: Diagnose macOS proxy 0.11.5
on:
  push:
    branches: [codex/diagnose-macos-proxy-0115]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
      - run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
      - name: Run diagnostic isolation checks
        run: |
          /usr/bin/curl --version
          for attempt in 1 2 3 4 5; do
            echo "Diagnostic iteration $attempt"
            cargo test --locked -p colossus-cli --test native_sandbox -- --nocapture
          done
      - name: Inspect diagnostic sandbox denials
        if: failure()
        run: sudo /usr/bin/log show --last 3m --style compact --predicate 'process == "sandboxd"' | tail -n 120
      - name: Compare unchanged release test
        if: always()
        run: |
          git show f2583618bba54d9a0b164e7b5913def53878c882:crates/colossus-cli/tests/native_sandbox.rs > crates/colossus-cli/tests/native_sandbox.rs
          for attempt in 1 2 3; do
            echo "Original iteration $attempt"
            cargo test --locked -p colossus-cli --test native_sandbox -- --nocapture
          done
      - name: Inspect original-test sandbox denials
        if: failure()
        run: sudo /usr/bin/log show --last 3m --style compact --predicate 'process == "sandboxd"' | tail -n 120
