name: PR validation

on:
  pull_request:
    types: [edited, opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify PR changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      rust_required: ${{ steps.changes.outputs.rust_required }}
      docs_required: ${{ steps.changes.outputs.docs_required }}
      dependency_required: ${{ steps.changes.outputs.dependency_required }}
      sdk_required: ${{ steps.changes.outputs.sdk_required }}
      desktop_required: ${{ steps.changes.outputs.desktop_required }}
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          fetch-depth: 0

      # A second useblacksmith/checkout in this job would remount the git-mirror
      # sticky disk over the first checkout's object alternates.
      - name: Check out trusted CI contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-trusted

      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | sh .ci-trusted/scripts/check_conventional_commit.sh --stdin

      - name: Test proposed CI classification and gate contracts
        run: ./scripts/ci/test-contracts.sh

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(git diff --name-only --diff-filter=ACDMRTUXB "$BASE_SHA" "$HEAD_SHA")
          trusted_classifier=.ci-trusted/scripts/ci/classify-changes.sh
          if test -f "$trusted_classifier"; then
            classification=$(sh "$trusted_classifier" "${changed_paths[@]}")
            if ! grep -q '^sdk_required=' <<<"$classification" ||
              ! grep -q '^desktop_required=' <<<"$classification"; then
              # A base revision from before component selection cannot be allowed
              # to skip newly introduced SDK or desktop validation.
              classification="${classification}
          sdk_required=true
          desktop_required=true"
            fi
          else
            # Bootstrap safely while this tier first lands. Future pull requests use
            # the immutable classifier from their base revision.
            classification='rust_required=true
          docs_required=true
          dependency_required=true
          sdk_required=true
          desktop_required=true'
          fi
          printf '%s\n' "$classification"
          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"

      - name: Install checksum-verified workflow linter
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" actionlint
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: actionlint

  format:
    name: Rust formatting and structure
    if: needs.classify.outputs.rust_required == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Check formatting and crate structure
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          ./scripts/check_crate_roots.sh
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path fuzz/Cargo.toml --no-deps --format-version 1 >/dev/null

  lint:
    name: Rust Clippy and fuzz harness lint
    if: needs.classify.outputs.rust_required == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Restore main Rust dependency build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          shared-key: pr-linux
          key: recipe-v1
          cache-targets: true
          save-if: false
      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Lint fuzz harnesses
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings

  rust:
    name: Rust unit tests
    if: needs.classify.outputs.rust_required == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          fetch-depth: 0

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0

      - name: Restore main Rust dependency build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          shared-key: pr-linux
          key: recipe-v1
          cache-targets: true
          save-if: false

      - name: Run Rust workspace unit tests
        run: cargo test --locked --workspace --lib

  sdk:
    name: Public SDK PR validation
    if: needs.classify.outputs.sdk_required == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Node.js 22.18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            sdk/typescript/package-lock.json
      - name: Install Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.10.18
          cache: pip
          cache-dependency-path: |
            sdk/python/requirements-codegen.txt
            sdk/python/requirements-dev.txt
      - name: Install Go 1.25
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.25.0
          cache-dependency-path: sdk/go/go.sum
      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0
      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
      - name: Configure read-only R2 compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        env:
          R2_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          R2_REGION: ${{ secrets.SCCACHE_REGION }}
          R2_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_READ_SECRET_ACCESS_KEY }}
        run: ./scripts/ci/configure-sccache-r2.sh read
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          key: pr-sdk
          cache-targets: false
      - name: Validate public SDKs
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          npm_config_cache: ${{ runner.temp }}/npm-pack-cache
        run: cargo xtask check sdk --base "$EVENT_BASE_SHA"

  desktop:
    name: Desktop PR validation
    if: needs.classify.outputs.desktop_required == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js 22.18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
      - name: Configure read-only R2 compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        env:
          R2_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          R2_REGION: ${{ secrets.SCCACHE_REGION }}
          R2_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_READ_SECRET_ACCESS_KEY }}
        run: ./scripts/ci/configure-sccache-r2.sh read
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          key: pr-desktop
          cache-targets: false
      - name: Test Managed Local sidecar contracts
        run: cargo xtask check sidecar
      - name: Validate desktop renderer
        run: cargo xtask check desktop

  documentation:
    name: Documentation PR build
    if: needs.classify.outputs.docs_required == 'true'
    needs: classify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1

      - name: Build and verify documentation
        run: cargo xtask check docs

      - name: Upload bounded documentation preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-preview-pr-${{ github.event.pull_request.number }}
          path: site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  dependency-policy:
    name: Dependency policy
    if: needs.classify.outputs.dependency_required == 'true'
    needs: classify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0

      - name: Install checksum-verified pinned supply-chain tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
          fallback: none

      - name: Enforce dependency policy
        run: cargo xtask check dependencies

  gate:
    name: Colossus PR gate
    if: always()
    needs: [classify, format, lint, rust, sdk, desktop, documentation, dependency-policy]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check out gate contract
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-trusted

      - name: Require every selected PR validation
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          RUST_REQUIRED: ${{ needs.classify.outputs.rust_required }}
          RUST_RESULT: ${{ needs.rust.result }}
          SDK_REQUIRED: ${{ needs.classify.outputs.sdk_required }}
          SDK_RESULT: ${{ needs.sdk.result }}
          DESKTOP_REQUIRED: ${{ needs.classify.outputs.desktop_required }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          DOCS_REQUIRED: ${{ needs.classify.outputs.docs_required }}
          DOCS_RESULT: ${{ needs.documentation.result }}
          DEPENDENCY_REQUIRED: ${{ needs.classify.outputs.dependency_required }}
          DEPENDENCY_RESULT: ${{ needs['dependency-policy'].result }}
        run: |
          set -eu
          trusted_gate=.ci-trusted/scripts/ci/require-pr-results.sh
          if test -f "$trusted_gate"; then
            sh "$trusted_gate" \
              "$CLASSIFY_RESULT" \
              "$RUST_REQUIRED" "$RUST_RESULT" \
              "$DOCS_REQUIRED" "$DOCS_RESULT" \
              "$DEPENDENCY_REQUIRED" "$DEPENDENCY_RESULT"
            # Reuse the base revision's fail-closed selector for the two new jobs.
            sh "$trusted_gate" \
              "$CLASSIFY_RESULT" \
              "$SDK_REQUIRED" "$SDK_RESULT" \
              "$DESKTOP_REQUIRED" "$DESKTOP_RESULT" \
              false skipped
            sh "$trusted_gate" \
              "$CLASSIFY_RESULT" \
              "$RUST_REQUIRED" "$FORMAT_RESULT" \
              "$RUST_REQUIRED" "$LINT_RESULT" \
              false skipped
          else
            # The base predates the contract, so the classifier selected every
            # validation tier. Require each one explicitly for this bootstrap run.
            test "$CLASSIFY_RESULT" = success
            test "$RUST_REQUIRED:$RUST_RESULT" = true:success
            test "$RUST_REQUIRED:$FORMAT_RESULT" = true:success
            test "$RUST_REQUIRED:$LINT_RESULT" = true:success
            test "$DOCS_REQUIRED:$DOCS_RESULT" = true:success
            test "$DEPENDENCY_REQUIRED:$DEPENDENCY_RESULT" = true:success
            test "$SDK_REQUIRED:$SDK_RESULT" = true:success
            test "$DESKTOP_REQUIRED:$DESKTOP_RESULT" = true:success
          fi
