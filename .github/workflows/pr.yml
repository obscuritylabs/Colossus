name: PR validation

on:
  pull_request:
    types: [edited, opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify PR changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_required: ${{ steps.changes.outputs.rust_required }}
      docs_required: ${{ steps.changes.outputs.docs_required }}
      dependency_required: ${{ steps.changes.outputs.dependency_required }}
      sdk_required: ${{ steps.changes.outputs.sdk_required }}
      desktop_required: ${{ steps.changes.outputs.desktop_required }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out trusted CI contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-trusted

      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | sh .ci-trusted/scripts/check_conventional_commit.sh --stdin

      - name: Test proposed CI classification and gate contracts
        run: ./scripts/ci/test-contracts.sh

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(git diff --name-only --diff-filter=ACDMRTUXB "$BASE_SHA" "$HEAD_SHA")
          trusted_classifier=.ci-trusted/scripts/ci/classify-changes.sh
          if test -f "$trusted_classifier"; then
            classification=$(sh "$trusted_classifier" "${changed_paths[@]}")
            if ! grep -q '^sdk_required=' <<<"$classification" ||
              ! grep -q '^desktop_required=' <<<"$classification"; then
              # A base revision from before component selection cannot be allowed
              # to skip newly introduced SDK or desktop validation.
              classification="${classification}
          sdk_required=true
          desktop_required=true"
            fi
          else
            # Bootstrap safely while this tier first lands. Future pull requests use
            # the immutable classifier from their base revision.
            classification='rust_required=true
          docs_required=true
          dependency_required=true
          sdk_required=true
          desktop_required=true'
          fi
          printf '%s\n' "$classification"
          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"

      - name: Install checksum-verified workflow linter
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" actionlint
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: actionlint

  rust:
    name: Rust PR validation
    if: needs.classify.outputs.rust_required == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Node.js 22.18
        if: needs.classify.outputs.sdk_required == 'true' || needs.classify.outputs.desktop_required == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            sdk/package-lock.json
            sdk/typescript/package-lock.json

      - name: Install Python 3.10
        if: needs.classify.outputs.sdk_required == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.10.18
          cache: pip
          cache-dependency-path: |
            sdk/python/requirements-codegen.txt
            sdk/python/requirements-dev.txt

      - name: Install Go 1.25
        if: needs.classify.outputs.sdk_required == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.25.0
          cache-dependency-path: sdk/go/go.sum

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          cache-targets: false

      - name: Check formatting and repository structure
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          ./scripts/check_crate_roots.sh

      - name: Validate locked metadata
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path fuzz/Cargo.toml --no-deps --format-version 1 >/dev/null

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Managed Local sidecar contracts
        if: needs.classify.outputs.desktop_required == 'true'
        run: >-
          cargo test --locked
          --package colossus-sidecar-protocol
          --package colossus-sidecar

      - name: Prepare exact-path AppArmor profile for workspace tests
        run: |
          cargo build --locked -p colossus-cli --bin colossus
          sudo install -d -o root -g root -m 0755 /usr/local/libexec/colossus-ci
          sudo install -o root -g root -m 0755 \
            target/debug/colossus /usr/local/libexec/colossus-ci/colossus
          sudo release/install-apparmor.sh /usr/local/libexec/colossus-ci/colossus
          echo 'COLOSSUS_NATIVE_TEST_BINARY=/usr/local/libexec/colossus-ci/colossus' >> "$GITHUB_ENV"

      - name: Run complete workspace tests
        run: cargo test --locked --workspace

      - name: Lint locked fuzz harnesses on stable
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings

      - name: Install pinned local SDK toolchains
        if: needs.classify.outputs.sdk_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./sdk/scripts/install-codegen-tools
          ./sdk/python/.codegen/bin/python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --requirement sdk/python/requirements-dev.txt
          ./sdk/python/.codegen/bin/python -m pip check

      - name: Reject hosted schema generators
        if: needs.classify.outputs.sdk_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*remote:' sdk/buf.gen.yaml; then
            echo "hosted Buf plugins may not receive the Colossus schema" >&2
            exit 1
          fi

      - name: Check public API compatibility with the PR base
        if: needs.classify.outputs.sdk_required == 'true'
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./sdk/scripts/check-breaking "$EVENT_BASE_SHA"

      - name: Lint, build, and generate the local Protobuf contract
        if: needs.classify.outputs.sdk_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./sdk/scripts/generate
          ./sdk/scripts/check-generated
          generated_status=$(git status --porcelain --untracked-files=all -- \
            sdk/generated-inputs.sha256 \
            sdk/go/gen \
            sdk/go/generated-output.sha256 \
            sdk/python/generated \
            sdk/python/generated-output.sha256 \
            sdk/typescript/src/gen \
            sdk/typescript/generated-output.sha256)
          if [ -n "$generated_status" ]; then
            echo "committed SDK bindings are stale:" >&2
            echo "$generated_status" >&2
            exit 1
          fi

      - name: Check, test, build, and pack the TypeScript SDK
        if: needs.classify.outputs.sdk_required == 'true'
        working-directory: sdk/typescript
        env:
          npm_config_cache: ${{ runner.temp }}/npm-pack-cache
        run: |
          npm run check
          npm test
          npm run build
          npm pack --dry-run --json --silent >"${{ runner.temp }}/typescript-pack.json"
          PACK_JSON="${{ runner.temp }}/typescript-pack.json" node - <<'NODE'
          const { readFileSync } = require("node:fs");

          const reports = JSON.parse(readFileSync(process.env.PACK_JSON, "utf8"));
          if (!Array.isArray(reports) || reports.length !== 1) {
            throw new Error("npm pack returned an unexpected report");
          }
          const paths = new Set(reports[0].files.map(({ path }) => path));
          const required = [
            "LICENSE",
            "README.md",
            "package.json",
            "dist/index.js",
            "dist/index.d.ts",
            "dist/error.js",
            "dist/gen/colossus/api/v1alpha1/agent_run.js",
            "dist/gen/colossus/api/v1alpha1/agent_run.d.ts",
            "dist/gen/google/rpc/status.js",
            "dist/gen/google/rpc/status.d.ts",
          ];
          for (const path of required) {
            if (!paths.has(path)) {
              throw new Error(`TypeScript package is missing ${path}`);
            }
          }
          for (const path of paths) {
            if (path.startsWith("src/") || path.startsWith(".test-dist/")) {
              throw new Error(`TypeScript package contains development source: ${path}`);
            }
          }
          NODE

      - name: Check, test, and build the Python SDK
        if: needs.classify.outputs.sdk_required == 'true'
        working-directory: sdk/python
        shell: bash
        run: |
          set -euo pipefail
          .codegen/bin/ruff format --check .
          .codegen/bin/ruff check .
          .codegen/bin/mypy
          PYTHONPATH=src:generated .codegen/bin/python -m unittest discover -s tests
          .codegen/bin/python -m build --no-isolation

      - name: Smoke-test the built Python wheel
        if: needs.classify.outputs.sdk_required == 'true'
        working-directory: sdk/python
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          WHEEL_PATH="$wheel" .codegen/bin/python - <<'PY'
          import os
          import zipfile

          wheel = os.environ["WHEEL_PATH"]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names), names
          assert "colossus/api/v1alpha1/py.typed" in names, names
          assert not any(name.startswith("google/") for name in names), names
          PY
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$sdist"
          SDIST_PATH="$sdist" .codegen/bin/python - <<'PY'
          import os
          import tarfile

          with tarfile.open(os.environ["SDIST_PATH"]) as archive:
              names = set(archive.getnames())

          def contains(suffix: str) -> bool:
              return any(name.endswith(suffix) for name in names)

          assert contains("/generated-output.sha256"), names
          assert contains("/generated/colossus/api/v1alpha1/agent_run_pb2.py"), names
          assert contains("/generated/colossus/api/v1alpha1/py.typed"), names
          assert not any("/generated/google/" in name for name in names), names
          PY
          PYTHONPATH="$wheel" .codegen/bin/python - <<'PY'
          from colossus.api.v1alpha1.agent_run_pb2 import RunResult, RunStateChanged, RunUpdate
          from colossus_sdk import decode_colossus_rpc_error, is_terminal_run_update
          from google.rpc.status_pb2 import Status

          assert callable(decode_colossus_rpc_error)
          assert Status(code=3).code == 3
          assert is_terminal_run_update(RunUpdate(result=RunResult()))
          assert not is_terminal_run_update(RunUpdate(state=RunStateChanged()))
          PY

      - name: Format, test, and vet the Go SDK
        if: needs.classify.outputs.sdk_required == 'true'
        working-directory: sdk/go
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(find . -name '*.go' -type f -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "unformatted Go SDK files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go test -mod=readonly ./...
          go vet -mod=readonly ./...

      - name: Install locked desktop renderer dependencies
        if: needs.classify.outputs.desktop_required == 'true'
        working-directory: apps/desktop
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Check and build the desktop renderer
        if: needs.classify.outputs.desktop_required == 'true'
        working-directory: apps/desktop
        run: |
          npm run check
          npm run build

  documentation:
    name: Documentation PR build
    if: needs.classify.outputs.docs_required == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify documentation
        run: ./scripts/docs-site build

      - name: Upload bounded documentation preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-preview-pr-${{ github.event.pull_request.number }}
          path: site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  dependency-policy:
    name: Dependency policy
    if: needs.classify.outputs.dependency_required == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20; upstream has no releases
        with:
          toolchain: 1.96.0

      - name: Install checksum-verified pinned supply-chain tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
          fallback: none

      - name: Enforce production and fuzz dependency policy
        run: |
          cargo deny --locked check -A license-not-encountered licenses sources bans
          cargo deny --locked check -D warnings advisories
          cargo audit -D warnings --file Cargo.lock
          cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check -A license-not-encountered licenses sources bans
          cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check -D warnings advisories
          cargo audit --no-fetch -D warnings --file fuzz/Cargo.lock

      - name: Enforce standalone desktop dependency policy
        run: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml --config deny.toml --locked check -A duplicate -A license-not-encountered licenses sources bans

      - name: Audit standalone desktop vulnerabilities
        # Tauri's lockfile contains target-specific GTK3 maintenance advisories even
        # on macOS. cargo-audit still fails on vulnerabilities while reporting those
        # informational warnings for review.
        run: cargo audit --no-fetch --file apps/desktop/src-tauri/Cargo.lock

  gate:
    name: Colossus PR gate
    if: always()
    needs: [classify, rust, documentation, dependency-policy]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out gate contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-trusted

      - name: Require every selected PR validation
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RUST_REQUIRED: ${{ needs.classify.outputs.rust_required }}
          RUST_RESULT: ${{ needs.rust.result }}
          DOCS_REQUIRED: ${{ needs.classify.outputs.docs_required }}
          DOCS_RESULT: ${{ needs.documentation.result }}
          DEPENDENCY_REQUIRED: ${{ needs.classify.outputs.dependency_required }}
          DEPENDENCY_RESULT: ${{ needs['dependency-policy'].result }}
        run: |
          set -eu
          trusted_gate=.ci-trusted/scripts/ci/require-pr-results.sh
          if test -f "$trusted_gate"; then
            sh "$trusted_gate" \
              "$CLASSIFY_RESULT" \
              "$RUST_REQUIRED" "$RUST_RESULT" \
              "$DOCS_REQUIRED" "$DOCS_RESULT" \
              "$DEPENDENCY_REQUIRED" "$DEPENDENCY_RESULT"
          else
            # The base predates the contract, so the classifier selected every
            # validation tier. Require each one explicitly for this bootstrap run.
            test "$CLASSIFY_RESULT" = success
            test "$RUST_REQUIRED:$RUST_RESULT" = true:success
            test "$DOCS_REQUIRED:$DOCS_RESULT" = true:success
            test "$DEPENDENCY_REQUIRED:$DEPENDENCY_RESULT" = true:success
          fi
