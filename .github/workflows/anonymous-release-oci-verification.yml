name: Anonymous whole-release OCI verification

on:
  push:
    branches: [codex/anonymous-release-verification-0-11-8-preview-1]

permissions:
  contents: read

concurrency:
  group: anonymous-release-oci-verification-v0.11.8-preview.1
  cancel-in-progress: false

jobs:
  anonymous-release-artifact:
    if: github.repository == 'obscuritylabs/Colossus' && github.event_name == 'push' && github.ref == 'refs/heads/codex/anonymous-release-verification-0-11-8-preview-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Bind actual immutable publication and inventory before payload access
        id: bindings
        shell: bash
        env:
          OCI_BINDINGS: |
            {
              "review_status": "root-reviewed",
              "tag": "v0.11.8-preview.1",
              "source_commit": "883fc21ac43c33472df8d0b964e381206d310606",
              "release_run_id": 39016689686,
              "publication_run_id": 39025385214,
              "publication_json_base64": "",
              "publication_sha256": "f771178f357e881fc91dd7bbb831433b1c77d36587de18a2bf44387659439f1f",
              "inventory_json_base64": "",
              "inventory_sha256": "85ee6dbe729fce504af39d55007c4adb452df5fc9d8fee321de5482009823624",
              "canonical_verifier_sha256": "f9e1b0e40965a11234946c2a91cbce68562001f652040bf2ad7e057f4158aad5"
            }
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          b = json.loads(os.environ['OCI_BINDINGS'])
          assert b['review_status'] == 'root-reviewed', 'PENDING actual publication, inventory and run bindings.'
          assert b['tag'] == 'v0.11.8-preview.1' and re.fullmatch(r'[0-9a-f]{40}', b['source_commit'])
          assert all(type(b[key]) is int and b[key] > 0 for key in ['release_run_id', 'publication_run_id'])
          assert re.fullmatch(r'[0-9a-f]{64}', b['canonical_verifier_sha256'])
          raw = {}
          for role, limit in [('publication', 16384), ('inventory', 131072)]:
              raw[role] = base64.b64decode(b[role + '_json_base64'], validate=True)
              assert 0 < len(raw[role]) <= limit
              assert hashlib.sha256(raw[role]).hexdigest() == b[role + '_sha256']
          p, inventory = json.loads(raw['publication']), json.loads(raw['inventory'])
          assert set(p) == {'tag', 'reference', 'pinnedReference', 'digest', 'assets'}
          assert p['tag'] == inventory['tag'] == b['tag']
          assert inventory['schemaVersion'] == 1 and inventory['repository'] == 'obscuritylabs/Colossus'
          assert inventory['sourceCommit'] == b['source_commit'] and inventory['prerelease'] is True
          assert type(inventory['releaseId']) is int and inventory['releaseId'] > 0
          assert inventory['releaseUrl'] == 'https://github.com/obscuritylabs/Colossus/releases/tag/' + b['tag']
          assert isinstance(inventory['publishedAt'], str) and inventory['publishedAt']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', p['digest'])
          repositories = ['ghcr.io/obscuritylabs/colossus-release', 'docker.io/obscuritylabs/colossus-release']
          assert p['reference'] in [value + ':' + b['tag'] for value in repositories]
          assert p['pinnedReference'] == p['reference'].rsplit(':', 1)[0] + '@' + p['digest']
          assets = inventory['assets']
          assert len(assets) == p['assets'] == 38
          names, ids, total = set(), set(), 0
          for asset in assets:
              assert set(asset) == {'name', 'id', 'size', 'digest'}
              name = asset['name']
              assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]{0,199}', name) and '..' not in name
              assert name.lower() not in names and type(asset['id']) is int and asset['id'] > 0 and asset['id'] not in ids
              names.add(name.lower()); ids.add(asset['id'])
              assert type(asset['size']) is int and 0 < asset['size'] <= 2**31
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', asset['digest'])
              total += asset['size']
          assert total <= 8 * 1024**3
          evidence = Path(os.environ['RUNNER_TEMP']) / 'anonymous-release-oci-evidence'
          evidence.mkdir(mode=0o700)
          for role, data in raw.items():
              with (evidence / (role + '.json')).open('xb') as output:
                  output.write(data)
          with (evidence / 'bindings.json').open('x') as output:
              json.dump({key: value for key, value in b.items() if not key.endswith('_json_base64')}, output)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_commit=' + b['source_commit'] + '\n')
          PY

      - name: Check out the exact trusted verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.bindings.outputs.source_commit }}
          persist-credentials: false

      - name: Install the maintained Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0

      - name: Install the maintained checksum-verified ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz
          checksum: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454

      - name: Pull the data artifact once anonymously and verify every original byte
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import hashlib, json, os, shutil, signal, stat, subprocess, tempfile, time
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'anonymous-release-oci-evidence'
          b = json.loads((evidence / 'bindings.json').read_text())
          p = json.loads((evidence / 'publication.json').read_text())
          inventory_path = evidence / 'inventory.json'
          inventory = json.loads(inventory_path.read_text())
          for role in ['publication', 'inventory']:
              assert hashlib.sha256((evidence / (role + '.json')).read_bytes()).hexdigest() == b[role + '_sha256']
          verifier = Path.cwd() / 'scripts/ci/release-oci.mjs'
          assert verifier.is_file() and not verifier.is_symlink()
          assert hashlib.sha256(verifier.read_bytes()).hexdigest() == b['canonical_verifier_sha256']
          config = Path(tempfile.mkdtemp(prefix='colossus-anonymous-oras-', dir=os.environ['RUNNER_TEMP']))
          auth = config / 'config.json'
          with auth.open('x') as output:
              output.write('{}\n')
          os.chmod(auth, 0o600)
          xdg = config / 'xdg'
          xdg.mkdir(mode=0o700)
          payload = evidence / 'payload'
          payload.mkdir(mode=0o700)
          oras, node = shutil.which('oras'), shutil.which('node')
          assert oras and node
          # No GitHub/registry token, Docker config, context, parent HOME or
          # auth-helper environment reaches ORAS or the Node byte verifier.
          environment = {'PATH': os.environ['PATH'], 'LANG': 'C.UTF-8',
                         'HOME': str(config), 'XDG_CONFIG_HOME': str(xdg)}
          started = time.monotonic()
          lowest = shutil.disk_usage(evidence).free
          outputs = []
          log = evidence / 'commands.log'
          log.touch(mode=0o600, exist_ok=False)
          record = {'status': 'running', 'anonymous': True, 'tag': b['tag'], 'source_commit': b['source_commit'],
                    'release_run_id': b['release_run_id'], 'publication_run_id': b['publication_run_id'],
                    'publication_sha256': b['publication_sha256'], 'inventory_sha256': b['inventory_sha256'],
                    'canonical_verifier_sha256': b['canonical_verifier_sha256'], 'pinned_reference': p['pinnedReference'],
                    'assets': len(inventory['assets']), 'asset_bytes': sum(value['size'] for value in inventory['assets']),
                    'payload_executed': False, 'registry_writes': False, 'pull_count': 0,
                    'fresh_owned_home': True, 'fresh_empty_registry_config': True,
                    'manifest_identity_boundary': 'ORAS digest-only resolution and pull; parsed manifest stdout is not independently hashed.'}

          def save():
              data = (json.dumps(record, indent=2) + '\n').encode()
              assert len(data) <= 32768
              (evidence / 'receipt.json').write_bytes(data)

          def bounds():
              global lowest
              lowest = min(lowest, shutil.disk_usage(evidence).free)
              assert lowest >= 10 * 1024**3 and time.monotonic() - started < 1200
              assert log.stat().st_size + sum(path.stat().st_size for path in outputs) <= 8 * 1024**2
              count, size = 0, 0
              for root, directories, files in os.walk(payload, followlinks=False):
                  for name in directories + files:
                      entry = Path(root) / name
                      facts = entry.lstat()
                      assert not stat.S_ISLNK(facts.st_mode)
                      if stat.S_ISREG(facts.st_mode):
                          count += 1; size += facts.st_size
                      else:
                          assert stat.S_ISDIR(facts.st_mode)
              assert count <= 64 and size <= 8 * 1024**3 + 131072

          def command(executable, arguments, seconds=60, input_text=None):
              bounds()
              destination = evidence / ('command-' + str(len(outputs) + 1) + '.stdout')
              outputs.append(destination)
              process = None
              with destination.open('xb') as stdout, log.open('ab') as stderr:
                  try:
                      process = subprocess.Popen([executable, *arguments], env=environment, stdin=subprocess.PIPE if input_text is not None else subprocess.DEVNULL, stdout=stdout, stderr=stderr, start_new_session=True)
                      if input_text is not None:
                          process.stdin.write(input_text.encode()); process.stdin.close()
                      deadline = min(started + 1200, time.monotonic() + seconds)
                      while process.poll() is None:
                          bounds()
                          assert destination.stat().st_size <= 1024**2 and time.monotonic() < deadline
                          time.sleep(0.5)
                      assert process.returncode == 0, 'Anonymous verification command failed.'
                  finally:
                      if process is not None and process.poll() is None:
                          os.killpg(process.pid, signal.SIGKILL); process.wait(timeout=10)
              bounds()
              assert destination.stat().st_size <= 1024**2
              return destination.read_text()

          try:
              assert lowest >= 25 * 1024**3, 'At least25GiB free required before payload access.'
              save()
              assert command(oras, ['resolve', '--registry-config', str(auth), p['pinnedReference']]).strip() == p['digest']
              # The maintained round-trip contract parses manifest stdout, without
              # promising byte-preserving output. Do not hash reserialized JSON or
              # claim an independent raw manifest digest; use ORAS digest-only access.
              manifest = json.loads(command(oras, ['manifest', 'fetch', '--registry-config', str(auth), p['pinnedReference']]))
              assert manifest['schemaVersion'] == 2 and manifest['artifactType'] == 'application/vnd.colossus.release.v1'
              assert manifest['annotations']['org.opencontainers.image.revision'] == b['source_commit']
              assert manifest['annotations']['org.opencontainers.image.version'] == b['tag']
              expected = {'release-inventory.json': ('sha256:' + b['inventory_sha256'], inventory_path.stat().st_size)}
              expected.update({'assets/' + value['name']: (value['digest'], value['size']) for value in inventory['assets']})
              assert len(manifest['layers']) == len(expected)
              seen = set()
              for layer in manifest['layers']:
                  title = layer['annotations']['org.opencontainers.image.title']
                  assert title not in seen and title in expected
                  seen.add(title)
                  assert (layer['digest'], layer['size']) == expected[title]
              record['pull_count'] = 1
              command(oras, ['pull', '--registry-config', str(auth), '--output', str(payload), p['pinnedReference']], seconds=600)
              # The module's main entry is guarded by its own argv URL check.
              # Importing verifyPulled does not call prepare/publish or execute assets.
              program = "import {readFile} from 'node:fs/promises'; import {pathToFileURL} from 'node:url'; const {verifyPulled}=await import(pathToFileURL(process.argv[4]).href); await verifyPulled(process.argv[2],JSON.parse(await readFile(process.argv[3],'utf8'))); console.log('CANONICAL_RELEASE_BYTES_VERIFIED');"
              result = command(node, ['--input-type=module', '-', str(payload), str(inventory_path), str(verifier)], seconds=180, input_text=program)
              assert result.strip() == 'CANONICAL_RELEASE_BYTES_VERIFIED'
              assert hashlib.sha256(verifier.read_bytes()).hexdigest() == b['canonical_verifier_sha256']
              assert json.loads(auth.read_text()) == {}
              bounds()
              record['status'] = 'passed'
          except BaseException as error:
              record['status'] = 'failed'
              record['error'] = (type(error).__name__ + ': ' + str(error))[:2048]
              raise
          finally:
              record.update(elapsed_seconds=round(time.monotonic() - started, 1), lowest_free_bytes=lowest)
              save()
              print(json.dumps(record, indent=2), flush=True)
          PY

      - name: Retain only the small sanitized verification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anonymous-release-oci-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anonymous-release-oci-evidence/receipt.json
          if-no-files-found: warn
          retention-days: 14
