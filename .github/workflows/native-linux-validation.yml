name: Exact-source native Linux validation

on:
  push:
    branches: [codex/native-linux-validation-82170e5a]

permissions:
  contents: read

concurrency:
  group: native-linux-validation-82170e5a
  cancel-in-progress: true

jobs:
  native-validation:
    if: github.repository == 'obscuritylabs/Colossus' && github.event_name == 'push' && github.ref == 'refs/heads/codex/native-linux-validation-82170e5a'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "2"
      VITEST_MAX_WORKERS: "4"
      CC: clang
      CXX: clang++
    steps:
      - name: Check out exact validated source and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c8a48b5623405b5e10a34fa9f3e635ade69face4
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Bind source, base, native kernel, and runner capacity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c8a48b5623405b5e10a34fa9f3e635ade69face4
          git cat-file -e e8f25d21c5693c5790055d0db2ff77abb8263d3a^{commit}
          git update-ref refs/remotes/origin/main e8f25d21c5693c5790055d0db2ff77abb8263d3a
          git merge-base --is-ancestor origin/main HEAD
          test -z "$(git status --porcelain)"
          test "$(git rev-parse v0.11.8^{})" = e8f9e9558c69398b73331953faaaf933513eed8f
          mkdir "$RUNNER_TEMP/native-validation-evidence"
          /usr/bin/python3 - <<'PY'
          import ctypes, json, os, platform
          from pathlib import Path
          libc = ctypes.CDLL(None, use_errno=True)
          abi = libc.syscall(444, None, 0, 1)
          capacities = {name: os.statvfs(path).f_bavail * os.statvfs(path).f_frsize for name, path in [('workspace', os.environ['GITHUB_WORKSPACE']), ('runner_temp', os.environ['RUNNER_TEMP'])]}
          proof = {'source_head': 'c8a48b5623405b5e10a34fa9f3e635ade69face4', 'base_head': 'e8f25d21c5693c5790055d0db2ff77abb8263d3a', 'kernel': platform.release(), 'landlock_abi': abi, 'probe_errno': ctypes.get_errno(), 'available_bytes': capacities, 'runner_kind': 'standard native ubuntu-24.04'}
          (Path(os.environ['RUNNER_TEMP']) / 'native-validation-evidence' / 'native-preflight.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof, indent=2))
          assert platform.machine() == 'x86_64' and abi >= 4, 'Native TCP isolation requires actual Landlock ABI4+.'
          assert min(capacities.values()) >= 25 * 1024**3, 'Need at least25GiB runner space; do not weaken the floor or delete required tools.'
          PY

      - name: Install native libraries from the repository devcontainer inventory
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake curl file libayatana-appindicator3-dev \
            libsecret-1-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev openssl \
            pkg-config librsvg2-dev wget apparmor python3-venv

      - name: Prepare separate Python for maintained PKI contracts
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/native-contracts"
          contract_python="$RUNNER_TEMP/native-contracts/bin/python"
          "$contract_python" -m pip install --disable-pip-version-check cryptography==50.0.2
          "$contract_python" -c 'import sys, cryptography; assert sys.version_info >= (3, 11); print(sys.version); print(cryptography.__version__)'
          printf 'PYTHON=%s\n' "$contract_python" >> "$GITHUB_ENV"

      - name: Install Node.js 22.18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0

      - name: Install SDK Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.10.18

      - name: Install Go 1.25
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.25.0
          cache: false

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Install checksum-verified pinned supply-chain tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
          fallback: none

      - name: Install checksum-verified pinned workflow linter
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          mkdir "$install_dir"
          tar -xzf "$archive" -C "$install_dir" actionlint
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Require existing native Docker for pinned documentation builds
        run: |
          docker version
          docker info

      - name: Install bounded exact-source gate supervisor
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/native-validation-guard.py" <<'PY'
          """Bound one unchanged native-host gate and retain exact-source evidence."""
          import ctypes
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time

          HEAD = 'c8a48b5623405b5e10a34fa9f3e635ade69face4'
          BASE = 'e8f25d21c5693c5790055d0db2ff77abb8263d3a'
          COMMANDS = {
              'prepare-cli': ['cargo', 'build', '--locked', '-p', 'colossus-cli', '--bin', 'colossus'],
              'pr': ['cargo', 'xtask', 'pr', '--base', 'origin/main'],
              'readiness': ['sh', 'release/verify-release-readiness.sh'],
          }
          name = sys.argv[1]
          assert name in COMMANDS and len(sys.argv) == 2
          root = Path(os.environ['GITHUB_WORKSPACE'])
          evidence = Path(os.environ['RUNNER_TEMP']) / 'native-validation-evidence'
          assert root.resolve() == root and root.stat().st_uid == os.getuid() and os.getuid() != 0
          assert evidence.resolve() == evidence and evidence.is_dir()

          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, text=True).strip()

          def source_ok():
              return git('rev-parse', 'HEAD') == HEAD and git('rev-parse', 'origin/main') == BASE and not git('status', '--porcelain')

          def available():
              sizes = [os.statvfs(path) for path in [root, evidence]]
              return min(size.f_bavail * size.f_frsize for size in sizes)

          assert source_ok(), 'Exact source/base and clean checkout required.'
          assert available() >= 15 * 1024**3, 'At least15GiB free required before each gate.'
          libc = ctypes.CDLL(None, use_errno=True)
          assert libc.prctl(36, 1, 0, 0, 0) == 0, 'Owned child subreaper required.'
          child = None
          owned = {}
          reason = None
          started = time.monotonic()
          lowest = available()

          def interrupted(signum, _frame):
              global reason
              reason = 'interrupted_by_signal_' + str(signum)

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)

          def table():
              result = {}
              for path in Path('/proc').iterdir():
                  if path.name.isdigit():
                      try:
                          fields = (path / 'stat').read_text().rsplit(')', 1)[1].split()
                          result[int(path.name)] = (int(fields[1]), fields[19])
                      except (FileNotFoundError, ProcessLookupError, PermissionError):
                          pass
              return result

          def refresh():
              current = table()
              parents = {os.getpid()}
              changed = True
              while changed:
                  changed = False
                  for pid, (parent, identity) in current.items():
                      if parent in parents and pid not in parents:
                          parents.add(pid)
                          owned[pid] = identity
                          changed = True
              return {pid: identity for pid, identity in owned.items() if pid in current and current[pid][1] == identity}

          def reap():
              if child is not None:
                  child.poll()
              for pid, (parent, identity) in table().items():
                  if parent == os.getpid() and (child is None or pid != child.pid) and owned.get(pid) == identity:
                      try:
                          os.waitpid(pid, os.WNOHANG)
                      except ChildProcessError:
                          pass

          def cleanup():
              for action, seconds in [(signal.SIGTERM, 15), (signal.SIGKILL, 10)]:
                  deadline = time.monotonic() + seconds
                  while time.monotonic() < deadline:
                      current = refresh()
                      if not current:
                          reap()
                          return True
                      for pid, identity in current.items():
                          descriptor = None
                          try:
                              descriptor = os.pidfd_open(pid, 0)
                              if table().get(pid, (None, None))[1] == identity:
                                  signal.pidfd_send_signal(descriptor, action, None, 0)
                          except ProcessLookupError:
                              pass
                          finally:
                              if descriptor is not None:
                                  os.close(descriptor)
                      reap()
                      time.sleep(0.2)
              return not refresh()

          record = {'source_head': HEAD, 'base_head': BASE, 'run_name': name, 'command': COMMANDS[name], 'status': 'running', 'owner_pid': os.getpid(), 'owner_start_time': table()[os.getpid()][1], 'owner_uid': os.getuid(), 'initial_available_bytes': lowest, 'stop_floor_bytes': 10 * 1024**3, 'native_host': True}
          receipt = evidence / (name + '.json')
          assert not receipt.exists()

          def save():
              temporary = receipt.with_suffix('.temporary')
              with temporary.open('x') as output:
                  json.dump(record, output, indent=2)
                  output.write('\n')
                  output.flush()
                  os.fsync(output.fileno())
              os.replace(temporary, receipt)
              fd = os.open(evidence, os.O_RDONLY | os.O_DIRECTORY)
              try:
                  os.fsync(fd)
              finally:
                  os.close(fd)

          save()
          log_path = evidence / (name + '.log')
          status = None
          next_checkpoint = started
          try:
              with log_path.open('x') as log:
                  child = subprocess.Popen(COMMANDS[name], cwd=root, stdout=log, stderr=subprocess.STDOUT, stdin=subprocess.DEVNULL, start_new_session=True)
                  record['command_pid'] = child.pid
                  record['command_start_time'] = table()[child.pid][1]
                  save()
                  while child.poll() is None:
                      refresh()
                      reap()
                      lowest = min(lowest, available())
                      if lowest < 10 * 1024**3:
                          reason = 'runner_disk_below_10GiB'
                      if log_path.stat().st_size > 16 * 1024**2:
                          reason = 'bounded_log_limit'
                      if time.monotonic() - started > (1800 if name == 'prepare-cli' else 7200):
                          reason = 'gate_time_bound'
                      if reason:
                          break
                      if time.monotonic() >= next_checkpoint:
                          record.update(elapsed_seconds=round(time.monotonic() - started, 1), lowest_available_bytes=lowest)
                          save()
                          print(json.dumps(record), flush=True)
                          next_checkpoint = time.monotonic() + 30
                      time.sleep(2)
                  status = child.poll()
                  log.flush()
                  os.fsync(log.fileno())
          except BaseException as error:
              reason = reason or type(error).__name__ + ': ' + str(error)
          finally:
              stopped = cleanup()
              if child is not None:
                  status = child.poll()
              lowest = min(lowest, available())
              clean = source_ok()
              if lowest < 10 * 1024**3:
                  reason = reason or 'runner_disk_below_10GiB_at_exit'
              record.update(status='passed' if status == 0 and reason is None and stopped and clean else 'failed', command_exit=status, reason=reason, final_source_head=git('rev-parse', 'HEAD'), final_base_head=git('rev-parse', 'origin/main'), final_source_clean=clean, owned_children_stopped=stopped, elapsed_seconds=round(time.monotonic() - started, 1), lowest_available_bytes=lowest, final_available_bytes=available())
              save()
          print(json.dumps(record, indent=2), flush=True)
          if record['status'] != 'passed' and log_path.exists():
              print(log_path.read_text(errors='replace')[-20000:], flush=True)
          raise SystemExit(0 if record['status'] == 'passed' else 1)
          PY

      - name: Prepare canonical exact-path AppArmor attachment
        run: |
          set -euo pipefail
          install_dir="/colossus-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          staged_binary="$install_dir/colossus"
          sudo install -d -o root -g root -m 0755 "$install_dir"
          sudo install -o root -g root -m 0755 /bin/true "$staged_binary"
          sudo release/install-apparmor.sh "$staged_binary"
          python3 "$RUNNER_TEMP/native-validation-guard.py" prepare-cli
          sudo install -o root -g root -m 0755 target/debug/colossus "$staged_binary"
          printf 'COLOSSUS_NATIVE_TEST_BINARY=%s\n' "$staged_binary" >> "$GITHUB_ENV"

      - name: Run unchanged selected PR validation on exact source
        run: python3 "$RUNNER_TEMP/native-validation-guard.py" pr

      - name: Run unchanged release readiness after actual PR success
        run: python3 "$RUNNER_TEMP/native-validation-guard.py" readiness

      - name: Retain bounded validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-validation-c8a48b56-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-validation-evidence
          if-no-files-found: error
          retention-days: 3
