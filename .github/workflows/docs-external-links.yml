name: Documentation external links

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-external-links
  cancel-in-progress: true

jobs:
  audit:
    name: Audit external links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --max-retries 2
            --timeout 20
            --exclude-mail
            --exclude '^http://127\.0\.0\.1'
            --exclude '^https://([^/]+\.)?example\.com'
            --exclude '^https://[^/]+\.example(?:/|$)'
            --exclude '^https://api\.github\.com'
            --exclude '^https://api\.openai\.com'
            --exclude '^https://openrouter\.ai/api/'
            "docs/**/*.md"
            "zensical.toml"
          fail: true
