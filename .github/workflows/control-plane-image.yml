name: Publish Control Plane image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable or preview release tag
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/control-plane-image.yml
      - scripts/ci/*control-plane*.mjs
      - scripts/ci/publish-control-plane-image.sh

permissions: {}

concurrency:
  group: control-plane-image-${{ github.event.release.tag_name || inputs.tag || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
      - run: node --test scripts/ci/control-plane-assets.test.mjs
      - run: bash -n scripts/ci/publish-control-plane-image.sh

  publish:
    name: Publish the exact tested multi-platform server
    needs: contracts
    if: >-
      github.repository == 'obscuritylabs/Colossus' &&
      ((github.event_name == 'release' && github.event.release.draft == false) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Use the protected main publisher, not downloaded executable code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
      - name: Authenticate with a job-scoped registry token
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Verify release bytes against trusted tag artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bash scripts/ci/publish-control-plane-image.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colossus-control-plane-publication
          path: |
            ${{ runner.temp }}/control-plane-image/publication.json
            ${{ runner.temp }}/control-plane-image/assets.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove the job-scoped registry session
        if: always()
        run: docker logout ghcr.io
