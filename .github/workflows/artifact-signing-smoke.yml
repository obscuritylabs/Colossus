name: Artifact Signing smoke

on:
  push:
    tags: ["vsigning-smoke-*"]

permissions:
  contents: read

jobs:
  sign:
    name: Sign and verify Windows executable
    runs-on: windows-2025
    environment: release-signing
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out signing probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20
        with:
          toolchain: 1.96.0

      - name: Compile probe
        shell: pwsh
        run: |
          'fn main() { println!("colossus-signing-probe"); }' |
            Set-Content -LiteralPath "$env:RUNNER_TEMP\probe.rs" -Encoding ascii
          rustc --edition 2024 "$env:RUNNER_TEMP\probe.rs" `
            -o "$env:RUNNER_TEMP\colossus-signing-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw "probe compilation failed" }
          $signature = Get-AuthenticodeSignature `
            -LiteralPath "$env:RUNNER_TEMP\colossus-signing-probe.exe"
          if ($signature.Status -ne 'NotSigned') {
            throw "probe must be unsigned before signing"
          }

      - name: Authenticate to Azure using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign probe with Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: colossus-code-sign
          certificate-profile-name: colossus
          files: ${{ runner.temp }}\colossus-signing-probe.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode publisher and run probe
        shell: pwsh
        run: |
          $path = "$env:RUNNER_TEMP\colossus-signing-probe.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $path
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode verification failed: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch 'CN=Obscurity Labs LLC(?:,|$)') {
            throw "unexpected signing publisher"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "RFC 3161 timestamp is missing"
          }
          $output = & $path
          if ($LASTEXITCODE -ne 0 -or $output -ne 'colossus-signing-probe') {
            throw "signed executable did not run correctly"
          }
          Write-Output "Azure Artifact Signing smoke passed"

  desktop:
    name: Sign and install Windows Desktop candidate
    runs-on: windows-2025
    environment: release-signing
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}\apps\desktop\src-tauri\target
      COLOSSUS_DESKTOP_RELEASE_CHANNEL: developer_preview
      COLOSSUS_DESKTOP_TARGET: x86_64-pc-windows-msvc
      COLOSSUS_DESKTOP_TEAM_ID: OBSCURITY_LABS_LLC
      COLOSSUS_DESKTOP_UPDATE_ENDPOINT: ""
      COLOSSUS_DESKTOP_UPDATE_PUBLIC_KEY: ""
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 22.18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-20
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - name: Enable shared compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Activate shared compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Cache Windows Desktop target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> apps/desktop/src-tauri/target
          key: signing-smoke-desktop-x86_64-pc-windows-msvc
          cache-targets: false

      - name: Install locked Desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - name: Build unsigned Desktop inputs
        shell: pwsh
        run: ./scripts/package-desktop-windows.ps1 -Phase build

      - name: Authenticate to Azure using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign bundled sidecar and CLI
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: colossus-code-sign
          certificate-profile-name: colossus
          files: |
            ${{ github.workspace }}\apps\desktop\src-tauri\binaries\colossus-sidecar-x86_64-pc-windows-msvc.exe
            ${{ github.workspace }}\apps\desktop\src-tauri\binaries\colossus-x86_64-pc-windows-msvc.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Bind signed nested binaries
        shell: pwsh
        run: ./scripts/package-desktop-windows.ps1 -Phase bind

      - name: Build NSIS and sign patched app, uninstaller, and installer
        shell: pwsh
        run: ./scripts/package-desktop-windows.ps1 -Phase bundle

      - name: Verify installer and manifest
        shell: pwsh
        run: ./scripts/package-desktop-windows.ps1 -Phase finalize

      - name: Smoke install signed Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc\release\bundle\nsis'
          $installer = @(Get-ChildItem -LiteralPath $bundle -Filter '*.exe' -File)
          if ($installer.Count -ne 1) { throw 'expected exactly one signed installer' }
          ./scripts/ci/verify-authenticode.ps1 -Path $installer[0].FullName
          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'NSIS installation failed' }
          $installed = @(
            Get-ChildItem -LiteralPath $env:LOCALAPPDATA -Filter 'colossus-desktop.exe' `
              -File -Recurse -ErrorAction SilentlyContinue
          )
          if ($installed.Count -ne 1) { throw 'desktop executable was not installed' }
          $installRoot = $installed[0].Directory.FullName
          foreach ($name in @('colossus-desktop.exe', 'colossus-sidecar.exe', 'colossus.exe')) {
            Write-Output "Checking installed $name"
            ./scripts/ci/verify-authenticode.ps1 -Path (Join-Path $installRoot $name)
          }
          $application = Start-Process -FilePath $installed[0].FullName -PassThru
          Start-Sleep -Seconds 8
          if ($application.HasExited) { throw 'signed Desktop exited during launch smoke' }
          Stop-Process -Id $application.Id -Force
          $application.WaitForExit()
          $uninstallers = @(
            Get-ChildItem -LiteralPath $installRoot -Filter '*uninstall*.exe' -File
          )
          if ($uninstallers.Count -ne 1) { throw 'expected one signed uninstaller' }
          ./scripts/ci/verify-authenticode.ps1 -Path $uninstallers[0].FullName
          $uninstall = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'NSIS uninstall failed' }
          if (Test-Path -LiteralPath $installed[0].FullName) { throw 'desktop remained after uninstall' }
