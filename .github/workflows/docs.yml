name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "documentation/legacy-routes.tsv"
      - "scripts/docs-site"
      - "scripts/generate-doc-redirects"
      - "zensical.toml"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "documentation/legacy-routes.tsv"
      - "scripts/docs-site"
      - "scripts/generate-doc-redirects"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Zensical site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and verify documentation
        run: ./scripts/docs-site build

      - name: Upload pull request preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview-pr-${{ github.event.pull_request.number }}
          path: site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
