name: Set up toolchain
description: Install selected tools from the locked inventory on supported runners
inputs:
  tools:
    description: Space-separated inventory tool names (without versions)
    required: true
runs:
  using: composite
  steps:
    - name: Select verified mise executable
      id: mise
      shell: bash
      run: sh ./scripts/ci/mise-bootstrap.sh "$RUNNER_OS" "$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
    - name: Install verified mise and selected tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ steps.mise.outputs.version }}
        sha256: ${{ steps.mise.outputs.sha256 }}
        install_args: --locked ${{ inputs.tools }}
        # Direct bin paths avoid shims auto-installing unselected tools.
        add_shims_to_path: false
        cache: true
