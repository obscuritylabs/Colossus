[package]
publish = false
name = "colossus-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Explicit human PTY ownership independent of agent execution"

[dependencies]
colossus-api.workspace = true
base64.workspace = true
portable-pty.workspace = true
sha2.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process", "event"] }

[target.'cfg(windows)'.dependencies]
colossus-windows-native.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
