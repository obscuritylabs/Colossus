[package]
name = "colossus-native-dictation"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[features]
probe = ["dep:cpal", "dep:hound", "dep:rubato", "dep:whisper-rs"]
download = ["probe", "dep:reqwest", "dep:tokio"]
metal = ["probe", "whisper-rs/metal"]

[[bin]]
name = "dictation-probe"
required-features = ["probe"]

[dependencies]
colossus-home = { version = "=0.11.8", path = "../colossus-home" }
cpal = { version = "=0.18.2", optional = true }
hound = { version = "=3.5.1", optional = true }
regex = "1.13.0"
rubato = { version = "=0.16.2", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
tokio = { version = "1.50.0", features = ["rt", "net", "time", "sync", "macros"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
whisper-rs = { version = "=0.16.0", default-features = false, optional = true }
zeroize = "1.8.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
