[package]
publish = false
name = "colossus-credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
chacha20poly1305.workspace = true
colossus-contracts.workspace = true
colossus-home.workspace = true
colossus-ports.workspace = true
fs4.workspace = true
getrandom.workspace = true
hex.workspace = true
keyring-core = "=1.0.0"
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "=1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 4.1 replaced the cryptographic DH/IV generator with fastrand; retain OsRng.
dbus-secret-service = { version = "=4.0.3", features = ["crypto-rust", "vendored"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
colossus-windows-native.workspace = true

[lints]
workspace = true
