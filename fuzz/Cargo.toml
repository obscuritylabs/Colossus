[package]
name = "colossus-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
colossus-fuzzing = { version = "=0.10.6", path = "../crates/colossus-fuzzing" }
libfuzzer-sys = "0.4"

[[bin]]
name = "contracts_json"
path = "fuzz_targets/contracts_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workflow_yaml"
path = "fuzz_targets/workflow_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workflow_condition"
path = "fuzz_targets/workflow_condition.rs"
test = false
doc = false
bench = false
