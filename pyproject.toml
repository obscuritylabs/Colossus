[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "colossus"
version = "0.1.0"
description = "A secure, layered CLI agentic harness with OpenAI-compatible online and offline providers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Colossus contributors" }]
keywords = [
  "agent",
  "airgap",
  "audit",
  "cli",
  "offline",
  "openai",
  "security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.23",
  "platformdirs>=4.3",
  "prompt-toolkit>=3.0",
  "pydantic>=2.9",
  "rich>=13.9",
  "structlog>=24.4",
  "textual>=0.85",
  "typer>=0.12",
]

[project.scripts]
colossus = "colossus.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/colossus"]

[tool.hatch.build.targets.wheel.force-include]
"src/colossus/py.typed" = "colossus/py.typed"
"src/colossus/bundled_skills/coding/manifest.json" = "colossus/bundled_skills/coding/manifest.json"
"src/colossus/bundled_skills/coding/SKILL.md" = "colossus/bundled_skills/coding/SKILL.md"
"src/colossus/bundled_skills/security-review/manifest.json" = "colossus/bundled_skills/security-review/manifest.json"
"src/colossus/bundled_skills/security-review/SKILL.md" = "colossus/bundled_skills/security-review/SKILL.md"
"src/colossus/bundled_skills/offline-dev/manifest.json" = "colossus/bundled_skills/offline-dev/manifest.json"
"src/colossus/bundled_skills/offline-dev/SKILL.md" = "colossus/bundled_skills/offline-dev/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "SECURITY.md",
  "AGENTS.md",
  "docs",
  "pyproject.toml",
  "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "T20", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["colossus"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=colossus --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
