schemaVersion: 2
access:
  profile: pinned
  tools:
    include: [echo]
    exclude: []
  actions:
    allow: []
    requireApproval: []
    deny: []
storage:
  path: state.redb
  startupVerification: incremental
  keys:
    kind: environment
    journal_variable: COLOSSUS_RELEASE_JOURNAL_KEY
    journal_key_id: release-smoke-journal-v1
    signing_variable: COLOSSUS_RELEASE_SIGNING_KEY
    anchor_path: anchor.json
policy:
  kind: built_in
  require_post_effect: false
workflows:
  repository: workflows
  user: workflows
providers:
  profiles:
    echo:
      kind: echo
      baseUrl: null
      credentialReference: null
      timeoutMs: 5000
models:
  profiles:
    echo:
      providerProfile: echo
      model: echo
      contextWindowTokens: 32768
      maxOutputTokens: 4096
      capabilities:
        toolCalls: true
        streaming: true
        imageInputs: false
  roles:
    primary: echo
agent:
  maxTurns: 1
subagents:
  maxConcurrent: 1
sandbox:
  backend: native
  profile: release-smoke-v1
  allowBrokerFallback: false
  helperPath: null
  ociRuntime: null
  ociImage: null
  ociProxyImage: null
  filesystem: []
  executables: []
  environment: []
  networkDestinations: []
  timeoutMs: 5000
  maxOutputBytes: 1048576
  maxProcesses: 1
  maxMemoryBytes: 67108864
  maxConcurrency: 1
