syntax = "proto3";

package google.rpc;

import "google/protobuf/any.proto";

// Status is the standard rich-error model carried in grpc-status-details-bin.
message Status {
  // code is the canonical google.rpc.Code numeric value.
  int32 code = 1;

  // message is the bounded developer-facing status message.
  string message = 2;

  // details contains typed, safe error details.
  repeated google.protobuf.Any details = 3;
}
